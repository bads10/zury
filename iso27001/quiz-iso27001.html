<title>Quiz ISO 27001 Lead Implementer</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Les 164 questions des 27 quiz de la formation ISO/IEC 27001 Lead Implementer, une par diapositive : mode entraînement avec verdict immédiat, mode corrigé avec la bonne réponse en vert, les mauvaises en rouge et l’explication.">
<style>
/* ==========================================================================
   Quiz ISO/IEC 27001 LI — feuille de style commune (questions + corrige)
   Identite : specification technique. Neutres ardoise froide, accent
   sarcelle « instrument », serif de labeur pour le contenu, mono pour tout
   l'appareillage (references, compteurs, touches).
   ========================================================================== */

/* --- jetons : theme clair (par defaut) ---------------------------------- */
:root {
  --ground: #f2f5f6;
  --surface: #ffffff;
  --surface-2: #e9eef0;
  --ink: #16242a;
  --ink-2: #4e656d;
  --ink-3: #7c9199;
  --line: #d3dde0;
  --line-strong: #b3c2c7;
  --accent: #0e6b79;
  --accent-ink: #0a5461;
  --accent-soft: #ddedef;
  --ok: #14713f;
  --ok-ink: #0d5530;
  --ok-soft: #dff0e5;
  --bad: #a82a26;
  --bad-ink: #87201c;
  --bad-soft: #f9e6e3;
  --shadow: 0 1px 2px rgba(22, 36, 42, .06), 0 12px 32px -18px rgba(22, 36, 42, .28);

  --serif: Charter, "Bitstream Charter", "Sitka Text", Cambria, "Iowan Old Style",
           "Palatino Linotype", "Liberation Serif", Georgia, serif;
  --mono: "JetBrains Mono", "IBM Plex Mono", "SF Mono", ui-monospace,
          "Cascadia Mono", "DejaVu Sans Mono", "Liberation Mono", monospace;

  --rail: 5px;
  --gutter: clamp(1rem, 4vw, 3rem);
}

/* --- jetons : theme sombre --------------------------------------------- */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #0c1417;
    --surface: #121d21;
    --surface-2: #18262b;
    --ink: #e3edef;
    --ink-2: #9cb0b6;
    --ink-3: #74898f;
    --line: #24363c;
    --line-strong: #34494f;
    --accent: #4fc6d4;
    --accent-ink: #93dfe8;
    --accent-soft: #0f3138;
    --ok: #55c98c;
    --ok-ink: #8ce1b1;
    --ok-soft: #0f2b1d;
    --bad: #ff8175;
    --bad-ink: #ffa89f;
    --bad-soft: #321613;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px -20px rgba(0, 0, 0, .8);
  }
}

:root[data-theme="dark"] {
  --ground: #0c1417;
  --surface: #121d21;
  --surface-2: #18262b;
  --ink: #e3edef;
  --ink-2: #9cb0b6;
  --ink-3: #74898f;
  --line: #24363c;
  --line-strong: #34494f;
  --accent: #4fc6d4;
  --accent-ink: #93dfe8;
  --accent-soft: #0f3138;
  --ok: #55c98c;
  --ok-ink: #8ce1b1;
  --ok-soft: #0f2b1d;
  --bad: #ff8175;
  --bad-ink: #ffa89f;
  --bad-soft: #321613;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 14px 36px -20px rgba(0, 0, 0, .8);
}

/* --- socle -------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100dvh;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--serif);
  font-size: 16px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}

.app {
  display: grid;
  grid-template-rows: auto 1fr auto;
  /* minmax(0, 1fr) empeche un enfant a fort min-content d elargir la page */
  grid-template-columns: minmax(0, 1fr);
  min-height: 100dvh;
}

button { font: inherit; color: inherit; cursor: pointer; }

[hidden] { display: none !important; }

:where(button, a, summary, [tabindex]):focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 3px;
}

.mono {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
}

.sr {
  position: absolute;
  width: 1px; height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

/* --- barre haute -------------------------------------------------------- */
.topbar {
  position: relative;
  z-index: 2;
  background: var(--surface);
  border-bottom: 1px solid var(--line);
}

.topbar__row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .5rem 1rem;
  padding: .7rem var(--gutter);
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
}

.brand {
  display: flex;
  align-items: baseline;
  gap: .55rem;
  min-width: 0;
}

.brand__mark {
  font-family: var(--mono);
  font-size: .68rem;
  font-weight: 700;
  letter-spacing: .14em;
  text-transform: uppercase;
  color: var(--accent-ink);
  background: var(--accent-soft);
  border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
  border-radius: 2px;
  padding: .2rem .45rem;
  white-space: nowrap;
}

.brand__name {
  font-size: .93rem;
  color: var(--ink-2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar__spacer { flex: 1; }

.counter {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: .8rem;
  letter-spacing: .04em;
  color: var(--ink-2);
  white-space: nowrap;
}
.counter b { color: var(--ink); font-weight: 700; }

/* releve du score, dans la bande d appareillage */
.score {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: .7rem;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}
.score b { color: var(--ok); font-weight: 700; }

.iconbtn {
  display: inline-flex;
  align-items: center;
  gap: .4rem;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 3px;
  padding: .34rem .6rem;
  transition: border-color .15s, color .15s, background .15s;
}
.iconbtn:hover { color: var(--ink); border-color: var(--line-strong); background: var(--surface-2); }

/* --- selecteur de mode -------------------------------------------------- */
.modeswitch {
  display: inline-flex;
  padding: 2px;
  gap: 2px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 4px;
}

.modeswitch__btn {
  font-family: var(--mono);
  font-size: .7rem;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: transparent;
  border: 0;
  border-radius: 3px;
  padding: .32rem .7rem;
  white-space: nowrap;
  transition: color .15s, background .15s, box-shadow .15s;
}
.modeswitch__btn:hover { color: var(--ink); }
.modeswitch__btn[aria-pressed="true"] {
  color: var(--accent-ink);
  background: var(--surface);
  box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 34%, transparent);
}

/* --- jauge de progression globale --------------------------------------- */
.progress {
  height: 3px;
  background: var(--surface-2);
  overflow: hidden;
}
.progress__fill {
  height: 100%;
  width: 0;
  background: var(--accent);
  transition: width .3s cubic-bezier(.4, 0, .2, 1);
}

/* --- bande de releve du quiz courant ------------------------------------ */
.ticks {
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

.ticks__row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .35rem .9rem;
  padding: .5rem var(--gutter);
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
  min-width: 0;
}

.ticks__label {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-3);
  white-space: nowrap;
}

.ticks__strip { display: flex; gap: 4px; flex-wrap: wrap; }

.tick {
  width: 22px;
  height: 9px;
  border: 1px solid var(--line-strong);
  border-radius: 1px;
  background: transparent;
  padding: 0;
  transition: transform .12s, background .2s, border-color .2s;
}
.tick:hover { transform: translateY(-1px); border-color: var(--accent); }
.tick[data-state="ok"] { background: var(--ok); border-color: var(--ok); }
.tick[data-state="bad"] { background: var(--bad); border-color: var(--bad); }
.tick[data-state="seen"] { background: var(--line-strong); }
.tick[aria-current="true"] { box-shadow: 0 0 0 2px var(--ground), 0 0 0 3px var(--accent); }

/* --- scene -------------------------------------------------------------- */
.stage {
  overflow-y: auto;
  padding: clamp(1.25rem, 4vh, 2.75rem) var(--gutter);
  display: flex;
  flex-direction: column;
}

/* margin:auto centre verticalement sans jamais rogner le haut quand le
   contenu depasse la hauteur de la scene (contrairement a justify-content) */
.slide {
  width: 100%;
  max-width: 940px;
  margin: auto;
  animation: rise .3s cubic-bezier(.2, .7, .3, 1) both;
}

@keyframes rise {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: none; }
}

/* --- en-tete de diapositive --------------------------------------------- */
.slide__eyebrow {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .5rem .75rem;
  margin-bottom: 1.1rem;
}

.chip {
  font-family: var(--mono);
  font-size: .67rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  padding: .22rem .5rem;
  border-radius: 2px;
  border: 1px solid var(--line-strong);
  color: var(--ink-2);
  white-space: nowrap;
}
.chip--quiz { color: var(--accent-ink); background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 30%, transparent); }
.chip--scenario { color: var(--ink); background: var(--surface-2); }

.slide__topic {
  font-family: var(--mono);
  font-size: .74rem;
  letter-spacing: .05em;
  color: var(--ink-2);
}

/* --- dossier de scenario ------------------------------------------------ */
.scenario {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: var(--rail) solid var(--line-strong);
  border-radius: 3px;
  margin-bottom: 1.6rem;
  box-shadow: var(--shadow);
}

.scenario > summary {
  display: flex;
  align-items: center;
  gap: .5rem;
  padding: .65rem 1rem;
  font-family: var(--mono);
  font-size: .69rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--ink-2);
  list-style: none;
  cursor: pointer;
}
.scenario > summary::-webkit-details-marker { display: none; }
.scenario > summary::before {
  content: "\25B8";
  color: var(--accent);
  font-size: .85rem;
  transition: transform .18s;
}
.scenario[open] > summary::before { transform: rotate(90deg); }
.scenario[open] > summary { border-bottom: 1px solid var(--line); }

.scenario__body {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  gap: 1.5rem;
  padding: .9rem 1.15rem 1.1rem;
  max-height: 32vh;
  overflow-y: auto;
}

.scenario__prose { max-width: 72ch; }
.scenario__prose p {
  margin: 0 0 .7rem;
  font-size: .93rem;
  line-height: 1.62;
  color: var(--ink-2);
}
.scenario__prose p:last-child { margin-bottom: 0; }

/* renvoi vers les questions rattachees au scenario */
.scenario__jump {
  display: flex;
  flex-direction: column;
  gap: .35rem;
  align-content: start;
  border-left: 1px solid var(--line);
  padding-left: 1.1rem;
}

.scenario__jump-label {
  font-family: var(--mono);
  font-size: .62rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-bottom: .1rem;
}

.jumpbtn {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: .74rem;
  text-align: left;
  color: var(--ink-2);
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 2px;
  padding: .22rem .5rem;
  white-space: nowrap;
  transition: color .15s, border-color .15s, background .15s;
}
.jumpbtn:hover { color: var(--ink); border-color: var(--accent); background: var(--surface-2); }
.jumpbtn[aria-current="true"] {
  color: var(--accent-ink);
  background: var(--accent-soft);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
  font-weight: 700;
}

/* --- enonce ------------------------------------------------------------- */
.question {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: clamp(.9rem, 2.5vw, 1.6rem);
  align-items: start;
  margin-bottom: clamp(1.4rem, 3.5vh, 2.2rem);
}

.question__index {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: clamp(1.5rem, 3.6vw, 2.3rem);
  font-weight: 700;
  line-height: 1;
  color: var(--ink-3);
  opacity: .55;
  padding-top: .12em;
  user-select: none;
}

.question__text {
  margin: 0;
  font-size: clamp(1.28rem, 2.9vw, 1.95rem);
  font-weight: 600;
  line-height: 1.32;
  letter-spacing: -.008em;
  text-wrap: balance;
  max-width: 34ch;
  max-width: min(100%, 46ch);
}

/* --- options ------------------------------------------------------------ */
.options {
  display: flex;
  flex-direction: column;
  gap: .6rem;
  list-style: none;
  margin: 0;
  padding: 0;
}

.options:not(:last-child) { margin-bottom: 1.5rem; }

.option {
  display: grid;
  grid-template-columns: auto 1fr auto;
  align-items: center;
  gap: 1rem;
  width: 100%;
  text-align: left;
  font-family: var(--serif);
  font-size: 1.02rem;
  line-height: 1.45;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: var(--rail) solid var(--line);
  border-radius: 3px;
  padding: .85rem 1.1rem;
  transition: border-color .16s, background .16s, transform .12s, box-shadow .16s;
  animation: rise .3s cubic-bezier(.2, .7, .3, 1) both;
  animation-delay: var(--delay, 0s);
}

.option:not(:disabled):hover {
  border-color: var(--line-strong);
  border-left-color: var(--accent);
  background: var(--surface);
  transform: translateX(2px);
  box-shadow: var(--shadow);
}

.option:disabled { cursor: default; }

.option__key {
  display: grid;
  place-items: center;
  width: 1.85rem;
  height: 1.85rem;
  flex: none;
  font-family: var(--mono);
  font-size: .82rem;
  font-weight: 700;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-radius: 2px;
}

.option__verdict {
  font-family: var(--mono);
  font-size: .66rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  white-space: nowrap;
  opacity: 0;
  transition: opacity .2s;
}

/* etats reveles : bonne reponse en vert, mauvaise en rouge */
.option[data-verdict] .option__verdict { opacity: 1; }

.option[data-verdict="ok"] {
  background: var(--ok-soft);
  border-color: color-mix(in srgb, var(--ok) 42%, transparent);
  border-left-color: var(--ok);
  color: var(--ok-ink);
}
.option[data-verdict="ok"] .option__key { background: var(--ok); border-color: var(--ok); color: var(--ok-soft); }
.option[data-verdict="ok"] .option__verdict { color: var(--ok); }

.option[data-verdict="bad"] {
  background: var(--bad-soft);
  border-color: color-mix(in srgb, var(--bad) 40%, transparent);
  border-left-color: var(--bad);
  color: var(--bad-ink);
}
.option[data-verdict="bad"] .option__key { background: var(--bad); border-color: var(--bad); color: var(--bad-soft); }
.option[data-verdict="bad"] .option__verdict { color: var(--bad); }

.option[data-picked="true"] { box-shadow: inset 0 0 0 1px currentColor; }

/* --- bandeau de resultat (fichier questions) ---------------------------- */
.verdictbar {
  display: flex;
  align-items: center;
  gap: .6rem;
  font-family: var(--mono);
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .1em;
  text-transform: uppercase;
  padding: .6rem .9rem;
  border-radius: 3px;
  margin-bottom: 1.2rem;
}
.verdictbar[data-verdict="ok"] { color: var(--ok-ink); background: var(--ok-soft); border: 1px solid color-mix(in srgb, var(--ok) 35%, transparent); }
.verdictbar[data-verdict="bad"] { color: var(--bad-ink); background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }
.verdictbar small { font-weight: 400; letter-spacing: .04em; text-transform: none; color: var(--ink-2); }

/* --- invitation a repondre ---------------------------------------------- */
.prompt {
  margin: 0;
  font-family: var(--mono);
  font-size: .72rem;
  letter-spacing: .05em;
  color: var(--ink-3);
}

/* --- explication -------------------------------------------------------- */
.explain {
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: var(--rail) solid var(--accent);
  border-radius: 3px;
  padding: 1rem 1.2rem 1.15rem;
  box-shadow: var(--shadow);
}

.explain__label {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-family: var(--mono);
  font-size: .67rem;
  font-weight: 700;
  letter-spacing: .13em;
  text-transform: uppercase;
  color: var(--accent-ink);
  margin-bottom: .55rem;
}
.explain__label::after {
  content: "";
  flex: 1;
  height: 1px;
  background: var(--line);
}

.explain p {
  margin: 0;
  font-size: .99rem;
  line-height: 1.62;
  color: var(--ink-2);
  max-width: 74ch;
}

/* --- barre de navigation ------------------------------------------------ */
.navbar {
  position: relative;
  z-index: 2;
  background: var(--surface);
  border-top: 1px solid var(--line);
}

.navbar__row {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: .5rem .75rem;
  padding: .7rem var(--gutter);
  max-width: 1180px;
  margin: 0 auto;
  width: 100%;
}

.navbtn {
  display: inline-flex;
  align-items: center;
  gap: .45rem;
  font-family: var(--mono);
  font-size: .74rem;
  font-weight: 700;
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--ink);
  background: var(--surface);
  border: 1px solid var(--line-strong);
  border-radius: 3px;
  padding: .48rem .85rem;
  transition: background .15s, border-color .15s, transform .12s;
}
.navbtn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--accent); }
.navbtn:active:not(:disabled) { transform: translateY(1px); }
.navbtn:disabled { opacity: .35; cursor: default; }
.navbtn--primary { color: #fff; background: var(--accent); border-color: var(--accent); }
:root[data-theme="dark"] .navbtn--primary { color: #06181c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .navbtn--primary { color: #06181c; } }
.navbtn--primary:hover:not(:disabled) { background: var(--accent-ink); border-color: var(--accent-ink); }

.keyhint {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .55rem;
  flex-wrap: wrap;
  font-family: var(--mono);
  font-size: .68rem;
  letter-spacing: .05em;
  color: var(--ink-3);
}

kbd {
  font-family: var(--mono);
  font-size: .68rem;
  color: var(--ink-2);
  background: var(--surface-2);
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 3px;
  padding: .05rem .32rem;
}

/* --- sommaire ----------------------------------------------------------- */
.sheet {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  background: var(--ground);
  background: color-mix(in srgb, var(--ground) 82%, transparent);
  backdrop-filter: blur(6px);
  padding: clamp(1rem, 5vh, 3rem) var(--gutter);
  overflow-y: auto;
}
.sheet[data-open="true"] { display: block; }

.sheet__panel {
  max-width: 1180px;
  margin: 0 auto;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 4px;
  box-shadow: var(--shadow);
  padding: clamp(1.25rem, 3vw, 2rem);
}

.sheet__head {
  display: flex;
  align-items: baseline;
  gap: 1rem;
  margin-bottom: 1.25rem;
  padding-bottom: .9rem;
  border-bottom: 1px solid var(--line);
}

.sheet__title {
  margin: 0;
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -.01em;
}

.sheet__grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(255px, 1fr));
  gap: .7rem;
}

.quizcard {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: .2rem .75rem;
  text-align: left;
  background: var(--surface);
  border: 1px solid var(--line);
  border-left: var(--rail) solid var(--line-strong);
  border-radius: 3px;
  padding: .7rem .85rem;
  transition: border-color .15s, background .15s, transform .12s;
}
.quizcard:hover { border-left-color: var(--accent); background: var(--surface-2); transform: translateX(2px); }
.quizcard[aria-current="true"] { border-left-color: var(--accent); background: var(--accent-soft); }

.quizcard__n {
  grid-row: span 2;
  align-self: center;
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--accent-ink);
}
.quizcard__title { font-size: .93rem; line-height: 1.35; font-weight: 600; }
.quizcard__meta {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: .67rem;
  letter-spacing: .07em;
  text-transform: uppercase;
  color: var(--ink-3);
}
.quizcard__meta .ok { color: var(--ok); }
.quizcard__meta .bad { color: var(--bad); }

/* --- diapositive de synthese -------------------------------------------- */
.wrap { max-width: 940px; }

.wrap__title {
  margin: .2rem 0 .4rem;
  font-size: clamp(1.7rem, 4.2vw, 2.6rem);
  font-weight: 600;
  letter-spacing: -.015em;
  text-wrap: balance;
}

.wrap__lede {
  margin: 0 0 1.8rem;
  font-size: 1.02rem;
  color: var(--ink-2);
  max-width: 62ch;
}

.metrics {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: .7rem;
  margin-bottom: 1.8rem;
}

.metric {
  background: var(--surface);
  border: 1px solid var(--line);
  border-top: 3px solid var(--line-strong);
  border-radius: 3px;
  padding: .9rem 1rem;
}
.metric--ok { border-top-color: var(--ok); }
.metric--bad { border-top-color: var(--bad); }
.metric--accent { border-top-color: var(--accent); }

.metric__value {
  font-family: var(--mono);
  font-variant-numeric: tabular-nums;
  font-size: 1.9rem;
  font-weight: 700;
  line-height: 1.1;
}
.metric--ok .metric__value { color: var(--ok); }
.metric--bad .metric__value { color: var(--bad); }

.metric__label {
  font-family: var(--mono);
  font-size: .66rem;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  margin-top: .25rem;
}

.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 3px; background: var(--surface); }

table.report {
  width: 100%;
  border-collapse: collapse;
  font-size: .92rem;
}
table.report th, table.report td {
  padding: .55rem .8rem;
  text-align: left;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
table.report th {
  font-family: var(--mono);
  font-size: .65rem;
  font-weight: 700;
  letter-spacing: .12em;
  text-transform: uppercase;
  color: var(--ink-3);
  background: var(--surface-2);
}
table.report td.title { white-space: normal; min-width: 18rem; }
table.report th.num { text-align: right; }
table.report td.num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
table.report tr:last-child td { border-bottom: 0; }
table.report td .ok { color: var(--ok); font-weight: 700; }

.linkbtn {
  font-family: inherit;
  font-size: inherit;
  text-align: left;
  color: var(--ink);
  background: transparent;
  border: 0;
  padding: 0;
  text-decoration: underline;
  text-decoration-color: var(--line-strong);
  text-underline-offset: 3px;
  transition: color .15s, text-decoration-color .15s;
}
.linkbtn:hover { color: var(--accent-ink); text-decoration-color: var(--accent); }
table.report td .bad { color: var(--bad); font-weight: 700; }

.wrap__actions { display: flex; gap: .6rem; flex-wrap: wrap; margin-top: 1.5rem; }

/* --- adaptations -------------------------------------------------------- */
@media (max-width: 900px) {
  .brand__name { display: none; }
}

@media (max-width: 620px) {
  .keyhint { display: none; }

  /* la barre haute passe sur deux lignes : reperes et actions au-dessus,
     selecteur de mode pleine largeur en dessous */
  .topbar__row { flex-wrap: wrap; gap: .45rem; }
  .modeswitch { order: 5; flex: 1 1 100%; }
  .modeswitch__btn { flex: 1; padding: .36rem .4rem; font-size: .66rem; }
  .counter { font-size: .72rem; }

  .iconbtn { padding: .3rem .45rem; font-size: .64rem; }
  .question { grid-template-columns: 1fr; gap: .5rem; }
  .question__index { font-size: 1.2rem; }
  .option { grid-template-columns: auto 1fr; gap: .75rem; }
  .option__verdict { grid-column: 2; }
  .ticks__strip, .ticks__label { display: none; }
  .ticks__row { justify-content: flex-end; }
  .scenario__body { grid-template-columns: minmax(0, 1fr); max-height: 42vh; }
  .scenario__jump { border-left: 0; border-top: 1px solid var(--line); padding: .8rem 0 0; flex-flow: row wrap; }
  .score { padding-left: .7rem; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-delay: 0ms !important;
    transition-duration: .001ms !important;
  }
}

<script>
var QUESTIONS = [{"n":1,"quiz":1,"quizTitle":"Normes et cadres réglementaires","scenario":null,"scenarioText":[],"question":"Que fournit ISO/IEC 27001 ?","options":["Lignes directrices pour la mise en œuvre d’un système de management de la sécurité de l’information","Exigences pour la mise en œuvre d’un système de management de la sécurité de l’information","Lignes directrices et exigences pour la mise en œuvre d’un système de management de la protection de la vie privée"],"correct":1,"explanation":"La norme ISO/IEC 27001 spécifie les exigences relatives à l’établissement, à la mise en œuvre, à la mise à jour et à l’amélioration continue d’un système de management de la sécurité de l’information, ainsi qu’à l’appréciation et au traitement des risques liés à la sécurité de l’information."},{"n":2,"quiz":1,"quizTitle":"Normes et cadres réglementaires","scenario":null,"scenarioText":[],"question":"Laquelle des affirmations suivantes est correcte ?","options":["Les organisations peuvent obtenir une certification conformément à ISO/IEC 27001","Les organisations peuvent obtenir une certification conformément à ISO/IEC 27003","Les organisations peuvent obtenir une certification conformément à ISO/IEC 27005"],"correct":0,"explanation":"Les organisations peuvent obtenir une certification conformément aux normes du système de management ISO qui spécifient les exigences, mais pas aux normes ISO qui fournissent des lignes directrices. ISO/IEC 27001 est une norme de système de management qui fournit des exigences et, à ce titre, les organisations peuvent obtenir une certification conformément à cette norme. La norme ISO/IEC 27003 fournit des recommandations et des explications sur les exigences de la norme ISO/IEC 27001 pour un SMSI. La norme ISO/IEC 27005, quant à elle, fournit des lignes directrices pour la gestion des risques liés à la sécurité de l’information."},{"n":3,"quiz":1,"quizTitle":"Normes et cadres réglementaires","scenario":null,"scenarioText":[],"question":"Laquelle des normes suivantes fournit un ensemble de référence de mesures de sécurité de l’information et des lignes directrices pour leur mise en œuvre ?","options":["ISO/IEC 27002","ISO/IEC 27701","ISO/IEC 27005"],"correct":0,"explanation":"La norme ISO/IEC 27002 fournit un ensemble de mesures de sécurité de l’information et des lignes directrices pour leur sélection, leur mise en œuvre et leur gestion. La norme ISO/IEC 27701 fournit des exigences pour la mise en œuvre d’un système de management de la protection de la vie privée, tandis que la norme ISO/IEC 27005 fournit des lignes directrices pour la gestion des risques liés à la sécurité de l’information."},{"n":4,"quiz":1,"quizTitle":"Normes et cadres réglementaires","scenario":null,"scenarioText":[],"question":"Dans quels domaines ISO/IEC 27001 et le Règlement général sur la protection des données (RGPD) se chevauchent-ils ?","options":["Collecte et traitement des DCP et droits des personnes concernées","Confidentialité, disponibilité et intégrité des données, et appréciation des risques","Sécurité physique, contrôle d’accès et amélioration continue"],"correct":1,"explanation":"La mise en œuvre des mesures de sécurité de la norme ISO/IEC 27001 peut contribuer à garantir la conformité au RGPD dans des domaines tels que la confidentialité, la disponibilité et l’intégrité des données, ainsi que l’appréciation des risques."},{"n":5,"quiz":1,"quizTitle":"Normes et cadres réglementaires","scenario":null,"scenarioText":[],"question":"Que signifie STAR, un programme d’assurance des fournisseurs de cloud à trois niveaux ?","options":["Security, Trust, Assurance, and Risk (Sécurité, Confiance, Assurance et Risque)","Security, Task, Action, and Results (Sécurité, Tâche, Action et Résultats)","Security, Transparency, Assurance, and Response (Sécurité, Transparence, Assurance et Réponse)"],"correct":0,"explanation":"La CSA dispose d’un programme d’assurance des fournisseurs de cloud à trois niveaux connu sous le nom de CSA Security, Trust, Assurance, and Risk (STAR). Il comporte deux principaux niveaux d’évaluation. Les évaluations de niveau 1 sont des auto-évaluations de la sécurité et de la protection de la vie privée que les organisations peuvent mener elles-mêmes. Les évaluations de niveau 2 sont des audits indépendants de tierce partie."},{"n":6,"quiz":2,"quizTitle":"Système de management de la sécurité de l’information (SMSI)","scenario":null,"scenarioText":[],"question":"Un système de management est un ensemble d’éléments interdépendants ou interactifs d’une organisation pour la mise en place des politiques, objectifs et processus dans le but d'atteindre ces objectifs.","options":["Vrai","Faux"],"correct":0,"explanation":"Selon ISO/IEC 27000, un système de management est un ensemble d’éléments interdépendants ou interactifs d’une organisation pour la mise en place des politiques et des objectifs, ainsi que des processus pour atteindre ces objectifs."},{"n":7,"quiz":2,"quizTitle":"Système de management de la sécurité de l’information (SMSI)","scenario":null,"scenarioText":[],"question":"Qu’appelle-t-on système de management intégré (SMI) ?","options":["Un système de management qui intègre toutes les lignes directrices et les bonnes pratiques afin de permettre la réalisation de son objectif et l'accomplissement de sa mission","Un système de management qui intègre toutes les composantes d’une entreprise dans un système cohérent afin de permettre la réalisation de son objectif et l'accomplissement de sa mission","Un système de management qui intègre tous les cadres et toutes les ressources afin de permettre la réalisation de son objectif et l'accomplissement de sa mission"],"correct":1,"explanation":"Un système de management intégré (SMI) favorise l’intégration de toutes les composantes d’une entreprise, ce qui permet à une organisation de réaliser son objectif et sa mission."},{"n":8,"quiz":2,"quizTitle":"Système de management de la sécurité de l’information (SMSI)","scenario":null,"scenarioText":[],"question":"Laquelle des propositions suivantes est un avantage d’un SMSI efficace ?","options":["Réduction des risques liés à la sécurité de l’information","Élimination complète des risques liés à la sécurité de l’information","Prévention de toutes les violations de données"],"correct":0,"explanation":"Un SMSI efficace aide une organisation à réduire les risques liés à la sécurité de l’information et à limiter l’exposition aux violations de la sécurité de l’information, à protéger les actifs et les informations sensibles, à créer un avantage concurrentiel, à améliorer la réputation et à accroître la confiance des clients, ainsi qu’à protéger la confidentialité, la disponibilité et l’intégrité des informations."},{"n":9,"quiz":2,"quizTitle":"Système de management de la sécurité de l’information (SMSI)","scenario":null,"scenarioText":[],"question":"L’Annexe A de la norme ISO/IEC 27001 comprend 114 mesures de sécurité réparties en cinq thèmes.","options":["Vrai","Faux"],"correct":1,"explanation":"L’Annexe A de la norme ISO/IEC 27001 comprend 93 mesures classées en quatre thèmes : organisationnelles, applicables aux personnes, physiques et technologiques."},{"n":10,"quiz":2,"quizTitle":"Système de management de la sécurité de l’information (SMSI)","scenario":null,"scenarioText":[],"question":"Comment définit-on l’approche processus ?","options":["Approche systématique de la sécurité de l’information d’une organisation dans le but d’atteindre ses objectifs opérationnels","Intégration du SMSI dans le contexte des activités et processus commerciaux dans l’ensemble de l’organisation","Identification et gestion méthodique des processus au sein d’une organisation"],"correct":2,"explanation":"« L’approche processus » renvoie à l’identification et à la gestion méthodique des processus utilisés dans une organisation, et plus particulièrement les interactions de ces processus."},{"n":11,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"Lequel des éléments suivants est considéré comme un actif organisationnel virtuel ?","options":["Comptes de messagerie","Propriété intellectuelle","Identité client numérique"],"correct":1,"explanation":"Les actifs organisationnels comprennent les actifs virtuels, tels que l’image de marque en ligne, la réputation, les plans d’affaires et la propriété intellectuelle, et les actifs physiques, tels que les serveurs, les câbles connectés et les postes de travail."},{"n":12,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"Qu’exige la confidentialité ?","options":["Que seuls les utilisateurs autorisés aient accès à des informations protégées et sensibles","Que les informations soient exactes et complètes et ne soient pas modifiées pendant le stockage ou le transit","Que les informations soient accessibles à la demande, indépendamment du lieu et du moment"],"correct":0,"explanation":"La confidentialité exige que seuls les utilisateurs autorisés aient accès aux données sensibles et protégées."},{"n":13,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"Laquelle des propositions suivantes N’est PAS un exemple de menace ?","options":["Vol de supports ou de documents","Données non chiffrées","Utilisation non autorisée d’un système"],"correct":1,"explanation":"Une menace est la cause potentielle d’un incident indésirable qui peut nuire au système ou à l’organisation. Les données non chiffrées sont une vulnérabilité et non une menace."},{"n":14,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"Quel principe de sécurité de l’information pourrait être affecté par une interruption de service ?","options":["Disponibilité","Confidentialité","Intégrité"],"correct":0,"explanation":"L’interruption de service peut avoir une incidence sur la disponibilité de l’information, car dans de tels cas, l’information peut ne pas être accessible à la demande, indépendamment du lieu et du moment."},{"n":15,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"La vulnérabilité est une faiblesse d’un actif ou d’une mesure de sécurité exploitable par une ou plusieurs menaces.","options":["Vrai","Faux"],"correct":0,"explanation":"La norme ISO/IEC 27000 définit la vulnérabilité comme une faiblesse d’un actif ou d’une mesure de sécurité exploitable par une ou plusieurs menaces."},{"n":16,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"À quel type de mesures appartiennent la séparation des tâches, la rotation des postes et les processus d’approbation ?","options":["Mesures techniques","Mesures managériales","Mesures administratives"],"correct":2,"explanation":"La séparation des tâches, les rotations des postes et les processus d’approbation sont des mesures liées à la structure organisationnelle, et qui par conséquent font partie des mesures administratives."},{"n":17,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"Quelle est la fonction de la mesure en faveur de la séparation des environnements de développement, de test et d’exploitation ?","options":["Préventive","Détective","Corrective"],"correct":0,"explanation":"La séparation du développement, des tests et de l’environnement opérationnel réduit le risque d’accès non autorisé ou de modifications de l’environnement opérationnel, empêchant tout incident potentiel. À ce titre, il s’agit d’une mesure préventive."},{"n":18,"quiz":3,"quizTitle":"Concepts et principes fondamentaux de la sécurité de l’information","scenario":null,"scenarioText":[],"question":"Une organisation a installé des systèmes d’alarme dans ses locaux. Sous quel type de mesure classe-t-on cette action, et quelle en est la fonction ?","options":["Administrative, préventive","Managériale, corrective","Technique, détective"],"correct":2,"explanation":"Par fonction, les alarmes sont des mesures détectives qui aident à détecter les risques. Par type, une alarme incendie est une mesure technique, car elle nécessite une installation technique."},{"n":19,"quiz":4,"quizTitle":"Lancement de la mise en œuvre du SMSI","scenario":null,"scenarioText":[],"question":"Quelle approche de mise en œuvre comprend l’application des bonnes pratiques en matière de gestion de projet ?","options":["Approche commerciale","Approche itérative","Approche systématique"],"correct":2,"explanation":"L’approche systématique se réfère à l’application des bonnes pratiques en matière de gestion de projet, telles que la norme ISO 10006."},{"n":20,"quiz":4,"quizTitle":"Lancement de la mise en œuvre du SMSI","scenario":null,"scenarioText":[],"question":"Quelle est la définition exacte du terme projet ?","options":["Processus unique consistant en un ensemble d’activités coordonnées et contrôlées dans le but d’atteindre un objectif conforme à des exigences spécifiques","Plus petit objet de travail identifié dans une organisation","Processus de planification, d’organisation, de contrôle et de rapport d’un ensemble d’activités visant à atteindre des objectifs"],"correct":0,"explanation":"Selon la norme ISO 9000, un projet est un processus unique consistant en un ensemble d’activités coordonnées et contrôlées, avec des dates de début et de fin, d’activités entreprises dans le but d’atteindre un objectif conforme à des exigences spécifiques, notamment les contraintes de temps, de coût et de ressources."},{"n":21,"quiz":4,"quizTitle":"Lancement de la mise en œuvre du SMSI","scenario":null,"scenarioText":[],"question":"Laquelle des déclarations suivantes concernant le SMSI est correcte ?","options":["Il convient d’intégrer de nouvelles technologies lors de la mise en œuvre du SMSI afin d’optimiser les processus","Il convient de définir les rôles et responsabilités des parties intéressées concernant le SMSI après le processus de mise en œuvre","Il convient d’intégrer le SMSI aux processus existants de l’organisation"],"correct":2,"explanation":"Il convient de concevoir le système initial avec la technologie déjà en place dans l’organisation ; l’optimisation du SMSI avec des technologies plus efficaces peut être réalisée dans la phase d’amélioration continue. Il convient de définir rapidement les rôles et responsabilités de toutes les parties intéressées dans le processus de mise en œuvre."},{"n":22,"quiz":4,"quizTitle":"Lancement de la mise en œuvre du SMSI","scenario":null,"scenarioText":[],"question":"Lequel des éléments suivants n’est PAS un facteur qui détermine l’approche pour la mise en œuvre d’un SMSI ?","options":["Niveau de maturité des mesures et des processus","Lois et règlements spécifiques","Dépendance à la technologie"],"correct":2,"explanation":"Les facteurs qui déterminent l’approche de mise en œuvre du SMSI comprennent la rapidité de mise en œuvre et les délais, le niveau de maturité des mesures et des processus, le domaine d’application de la mise en œuvre, les lois et réglementations applicables et le soutien de la direction générale."},{"n":23,"quiz":4,"quizTitle":"Lancement de la mise en œuvre du SMSI","scenario":null,"scenarioText":[],"question":"Qu’entend-on par approche itérative ?","options":["Mise en œuvre globale des processus SMSI, et non par isolation de certains processus","Mise en œuvre rapide du SMSI en respectant les exigences minimales de la norme et en procédant ensuite à une amélioration continue","Harmonisation du SMSI avec d’autres systèmes de management mis en place au sein de l’organisation"],"correct":1,"explanation":"Les options A et C correspondent respectivement à l’approche systémique et à l’approche intégrée."},{"n":24,"quiz":5,"quizTitle":"Compréhension de l’organisation et de son contexte","scenario":null,"scenarioText":[],"question":"Pourquoi est-il important de comprendre la mission, les objectifs, les valeurs et les stratégies d’une organisation ?","options":["Pour faciliter le processus d’audit interne","Pour créer une carte de tous les processus","Pour assurer un alignement cohérent avec les objectifs de sécurité de l’information"],"correct":2,"explanation":"Comprendre la mission, les objectifs, les valeurs et les stratégies d’une organisation garantit un alignement cohérent avec les objectifs de sécurité de l’information et répond aux défis et aux risques de sécurité spécifiques au marché."},{"n":25,"quiz":5,"quizTitle":"Compréhension de l’organisation et de son contexte","scenario":null,"scenarioText":[],"question":"Qu’exige, entre autres, la norme ISO/IEC 27001 pour fixer des objectifs en matière de sécurité de l’information ?","options":["Impliquer toutes les parties prenantes","Conserver les informations documentées","Évaluer leur réalisation tous les trimestres"],"correct":1,"explanation":"Conformément à la norme ISO/IEC 27001, les objectifs en matière de sécurité de l’information doivent être mesurables, si possible."},{"n":26,"quiz":5,"quizTitle":"Compréhension de l’organisation et de son contexte","scenario":null,"scenarioText":[],"question":"______________________________________ est une personne ou une organisation susceptible d’affecter, d’être affectée ou de se sentir affectée par une décision ou une activité.","options":["Un client","Une partie intéressée","Un fournisseur"],"correct":1,"explanation":"La norme ISO 9000 définit une partie intéressée comme une personne ou un organisme qui peut soit influer sur une décision ou une activité, soit être influencée ou s’estimer influencée par une décision ou une activité."},{"n":27,"quiz":5,"quizTitle":"Compréhension de l’organisation et de son contexte","scenario":null,"scenarioText":[],"question":"Lequel des éléments suivants n’est PAS à prendre en considération lors de l’analyse du contexte interne de l’organisation ?","options":["Concurrents","Gouvernance et structure organisationnelle","Flux d’informations et processus décisionnels"],"correct":0,"explanation":"Le contexte interne peut comprendre, entre autres, la gouvernance, la structure organisationnelle, les flux d’information et les processus décisionnels. Les concurrents sont analysés lors de l’identification et de l’analyse des parties intéressées."},{"n":28,"quiz":5,"quizTitle":"Compréhension de l’organisation et de son contexte","scenario":null,"scenarioText":[],"question":"Quelles exigences de parties intéressées, parmi celles énumérées ci-dessous, les organisations doivent-elles prendre en considération, conformément à l’article 4.2 de la norme ISO/IEC 27001 ?","options":["Exigences légales et réglementaires","Exigences relatives aux changements climatiques","À la fois A et B"],"correct":2,"explanation":"Conformément à l’article 4.2 de l’ISO/IEC 27001, pour comprendre les besoins et les attentes des parties intéressées, l’organisation doit déterminer les exigences pertinentes des parties intéressées, lesquelles peuvent inclure des exigences légales et réglementaires et des obligations contractuelles, ainsi que des exigences liées aux changements climatiques."},{"n":29,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":null,"scenarioText":[],"question":"Quels facteurs peuvent, entre autres, affecter le domaine d’application du SMSI ?","options":["Fonctions de soutien, telles que les services informatiques et applications logicielles","Fonctions externalisées","À la fois A et B"],"correct":2,"explanation":"Il convient qu’une organisation prenne en compte toutes les fonctions qui sont externalisées, y compris celles qui sont confiées à des fournisseurs indépendants, lorsqu’elle définit le domaine d’application du SMSI."},{"n":30,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":null,"scenarioText":[],"question":"Pendant la définition du domaine d’application du SMSI, l’organisation doit tenir compte des interfaces et des dépendances entre les activités qu’elle mène et celles réalisées par d’autres organisations.","options":["Vrai","Faux"],"correct":0,"explanation":"Lorsqu’elle définit le domaine d’application du SMSI, une organisation doit notamment tenir compte des interfaces et des dépendances entre les activités menées par l’organisation et celles menées par d’autres organisations."},{"n":31,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":null,"scenarioText":[],"question":"Laquelle des dimensions suivantes convient-il de prendre en considération lorsqu’on établit les limites du domaine d’application du SMSI ?","options":["Limites du système d’information","Limites physiques","À la fois A et B"],"correct":2,"explanation":"Le SMSI compte trois limites principales : les limites des systèmes d’information, les limites physiques et les limites organisationnelles."},{"n":32,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":null,"scenarioText":[],"question":"Quelles limites du SMSI l’organisation peut-elle déterminer en évaluant les responsabilités des décideurs et leurs domaines d’influence ?","options":["Limites organisationnelles","Limites physiques","Limites du système d’information"],"correct":0,"explanation":"Les limites organisationnelles du domaine d’application du SMSI peuvent comprendre un processus clé, un service, toute l’organisation ou les intervenants de l’organisation. Une méthode efficace pour déterminer les limites organisationnelles consiste à évaluer les responsabilités des décideurs et leurs domaines d’influence au sein de l’organisation."},{"n":33,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":null,"scenarioText":[],"question":"Laquelle des déclarations suivantes concernant le domaine d’application du SMSI est correcte ?","options":["Il convient de classer le domaine d’application du SMSI parmi les informations confidentielles","Le domaine d’application du SMSI n’a pas à prendre en considération les besoins et les attentes des parties intéressées","Il convient que le domaine d’application du SMSI soit disponible sous forme d’informations documentées"],"correct":2,"explanation":"Pour se conformer à la norme ISO/IEC 27001, une organisation devrait conserver le domaine d’application de son SMSI sous forme d’informations documentées."},{"n":34,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":null,"scenarioText":[],"question":"Quel est le processus recommandé pour apporter des modifications au domaine d’application du SMSI ?","options":["Les modifications doivent être automatiquement mises en œuvre si l’organisation est certifiée par une organisation d’évaluation de la conformité (OEC)","Il convient de justifier et d’approuver les changements lors d’une revue de direction","Les changements devraient être documentés et approuvés uniquement par le gestionnaire de projet du SMSI"],"correct":1,"explanation":"Il convient que les organisations mettent en place un processus pour les demandes de changement. Toute demande de changement devrait être justifiée et approuvée lors d’une revue de direction. Si l’organisation est certifiée par un organisme d’évaluation de la conformité (OEC), les changements de domaine d’application peuvent nécessiter une revue et une approbation par l’OEC."},{"n":35,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":1,"scenarioText":["YoMedia est une société d’études de marché basée à Milan, en Italie, qui fournit des services de recherche dans le monde entier. L’entreprise collecte, analyse et interprète les données clients afin d’offrir des solutions à ses clients sur la base des résultats. En raison de la nature de ses services, la direction de YoMedia a décidé de mettre en œuvre un système de management de la sécurité de l’information (SMSI) conformément aux exigences de la norme ISO/IEC 27001, afin d’assurer la confidentialité, la disponibilité et l’intégrité de l’information. En outre, en tant qu’entreprise opérant au sein de l’Union européenne (UE), YoMedia s’engage à respecter le Règlement général sur la protection des données (RGPD) afin de protéger les droits à la vie privée de ses clients.","Pour mettre en œuvre efficacement le SMSI et assurer la conformité au RGPD, YoMedia a mobilisé une équipe SMSI dédiée. Elle comprenait des membres de divers services, notamment les services informatique, juridique, de conformité et le service clientèle. Ils avaient pour responsabilité de mettre en œuvre efficacement le SMSI et d’assurer la conformité au RGPD.","Dans un premier temps, l’équipe SMSI a identifié tous les systèmes et processus qui traitent les données et informations des clients, assurant ainsi leur inclusion dans le domaine d’application du SMSI. Le domaine d’application couvrait les aspects organisationnels, informatiques et de communication, ainsi que les aspects physiques. Pour définir les limites du SMSI, l’équipe a utilisé l’approche consistant à adopter les limites utilisées par les utilisateurs eux-mêmes. Elle a également pris en compte les limites géographiques et les limites temporelles.","De plus, l’équipe SMSI a procédé à une analyse approfondie des forces et des faiblesses de YoMedia dans le but de déterminer où l’organisation allait investir ses ressources. L’équipe a mené des entretiens avec les employés de l’entreprise et a utilisé diverses techniques pour recueillir de l’information sur les processus, procédures, politiques et mesures de sécurité existants. Au cours de l’analyse, l’équipe a découvert que YoMedia utilise un logiciel de contrôle d’accès qui permet uniquement aux utilisateurs autorisés d’accéder aux informations sensibles. Cependant, leur application logicielle et leurs programmes possèdent une interface utilisateur complexe qui se traduit par un grand nombre d’erreurs de saisie de données par le personnel au quotidien. De plus, en menant des entretiens, l’équipe a appris que plusieurs employés de différents services n’avaient pas reçu de formation en sécurité.","Sur la base de ses constatations, l’équipe SMSI a conclu que l’entreprise doit redéfinir ses besoins en formation et simplifier son interface utilisateur pour répondre efficacement aux problèmes identifiés."],"question":"En utilisant les limites privilégiées par les utilisateurs, quelle approche l’équipe SMSI a-t-elle utilisée pour définir les limites organisationnelles ?","options":["Approche réaliste","Approche commune","Approche ad hoc"],"correct":0,"explanation":"L’approche réaliste adoptera la définition de limite employée par les utilisateurs eux-mêmes. En revanche, selon une approche commune, le responsable du programme choisira une limite qui atteint ses objectifs analytiques."},{"n":36,"quiz":6,"quizTitle":"Domaine d’application du SMSI","scenario":1,"scenarioText":["YoMedia est une société d’études de marché basée à Milan, en Italie, qui fournit des services de recherche dans le monde entier. L’entreprise collecte, analyse et interprète les données clients afin d’offrir des solutions à ses clients sur la base des résultats. En raison de la nature de ses services, la direction de YoMedia a décidé de mettre en œuvre un système de management de la sécurité de l’information (SMSI) conformément aux exigences de la norme ISO/IEC 27001, afin d’assurer la confidentialité, la disponibilité et l’intégrité de l’information. En outre, en tant qu’entreprise opérant au sein de l’Union européenne (UE), YoMedia s’engage à respecter le Règlement général sur la protection des données (RGPD) afin de protéger les droits à la vie privée de ses clients.","Pour mettre en œuvre efficacement le SMSI et assurer la conformité au RGPD, YoMedia a mobilisé une équipe SMSI dédiée. Elle comprenait des membres de divers services, notamment les services informatique, juridique, de conformité et le service clientèle. Ils avaient pour responsab
