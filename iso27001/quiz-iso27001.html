mesures de sécurité de l’information, laquelle des mesures de sécurité suivantes a été mise en œuvre pour répartir les responsabilités au sein de l’entreprise ?","options":["A 5.2 Fonctions et responsabilités liées à la sécurité de l’information","Annexe A 5.3 Séparation des tâches","Annexe A 5.4 Responsabilités de la direction"],"correct":1,"explanation":"L’article 5.3 Séparation des tâches de la norme ISO/IEC 27002 vise à atténuer les risques de fraude, d’erreur et de contournement des mesures de sécurité de l’information en assurant une répartition appropriée des responsabilités au sein de l’organisation."},{"n":127,"quiz":21,"quizTitle":"Gestion des opérations de sécurité (partie 2)","scenario":3,"scenarioText":["Ecovista Energy Global (EVEG) est une société innovante axée sur le développement durable fondée en 2015, à Amsterdam, aux Pays-Bas. Elle opère à l’international et a établi une présence importante en Europe, en Asie du Sud-est et en Amérique du Nord. EVEG est spécialisée dans la fourniture de solutions écologiques et écoénergétiques aux entreprises et aux industries qui cherchent à réduire leur impact négatif sur l’environnement. L’entreprise propose un large éventail de solutions d’énergies renouvelables, y compris des systèmes d’énergie solaire, des installations éoliennes et des technologies de conversion de la biomasse. À mesure que EVEG se développait et étendait ses opérations à l’échelle mondiale, garantir la sécurité de ses informations et de ses systèmes est devenu crucial. À ce titre, la direction générale d’EVEG a décidé de mettre en œuvre un système de management de la sécurité de l’information (SMSI) conformément à la norme ISO/IEC 27001. Après une appréciation complète des risques, l’équipe SMSI a identifié les mesures de sécurité de l’information de l’Annexe A de la norme ISO/IEC 27001 qui étaient critiques à la posture de sécurité de l’organisation.","Pour protéger ses données sensibles, l’équipe SMSI a mis en œuvre des systèmes de contrôle d’accès robustes pour s’assurer que les employés n’ont accès qu’aux informations nécessaires à leurs rôles. En outre, l’authentification multifacteurs (AMF) a également été introduite pour les comptes privilégiés, afin de réduire davantage le risque d’accès non autorisé. De plus, l’équipe a reconnu l’importance de séparer les tâches et responsabilités conflictuelles au sein de l’organisation. Dans le cadre des mesures de sécurité, la direction générale s’est assurée que les rôles et responsabilités des employés sont clairement définis, et que les tâches conflictuelles sont séparées pour prévenir les abus potentiels ou empêcher l’accès non autorisé à des informations sensibles.","L’équipe SMSI s’est également penchée sur la nécessité de préserver la sécurité de l’information à un niveau approprié pendant les perturbations. L’équipe SMSI a établi que les imprévus, tels que les catastrophes naturelles, les cyberattaques ou les défaillances du système, peuvent potentiellement avoir un impact sur les opérations et la sécurité de l’information d’EVEG. C’est pourquoi l’équipe SMSI a soigneusement planifié ces perturbations et s’est préparée à cet effet, en veillant à ce que la sécurité de l’information reste robuste et efficace, même dans des circonstances difficiles.","L’équipe SMSI a également établi qu’il est essentiel de conserver des copies de sauvegarde des informations, des logiciels et des systèmes. À ce titre, elle a établi une politique complète et spécifique à la thématique de la sauvegarde, en veillant à ce que les copies de sauvegarde régulières soient créées et maintenues en toute sécurité.","Outre l’accent mis sur les contrôles d’accès, l’authentification multifacteurs et la planification des situations d’urgence, l’équipe SMSI a accordé la priorité à la protection de la précieuse propriété intellectuelle d’EVEG et à l’utilisation sécurisée des informations sensibles. L’équipe a décidé de mettre en œuvre des mesures de sécurité qui définissent des règles efficaces pour l’utilisation des techniques cryptographiques, notamment la gestion des clés cryptographiques. En outre, pour protéger les droits de propriété intellectuelle, l’équipe a mis en œuvre des procédures appropriées afin de protéger ses actifs intellectuels importants contre l’utilisation non autorisée, la reproduction ou la violation.","L’équipe SMSI n’a pas procédé à une analyse approfondie des coûts pour la mise en œuvre des mesures de sécurité. Elle a donc alloué des ressources insuffisantes dans certains domaines. L’équipe a rencontré des difficultés lors de la définition et de la mise en œuvre efficace des règles de gestion des clés cryptographiques, compromettant ainsi la sécurité de ses informations sensibles. Le manque de ressources et de préparation a également entraîné des écarts dans ses procédures de sauvegarde et de récupération. En conséquence, l’entreprise n’a pas pu tester l’efficacité des procédures de sauvegarde qui auraient garanti la récupérabilité des données et des systèmes en cas de perturbations."],"question":"Qu’est-ce que l’équipe SMSI a fait pour assurer la fiabilité et la récupérabilité de ses données et systèmes en cas de perturbations ?","options":["Elle a mis en place une politique de sauvegarde","Elle a effectué des sauvegardes régulières","À la fois A et B"],"correct":2,"explanation":"L’Annexe A 8.13 de la norme ISO/IEC 27001 exige des organisations qu’elles tiennent à jour et testent régulièrement des copies de sauvegarde d’informations, de logiciels et de systèmes conformément à une politique de sauvegarde spécifique à chaque sujet convenu."},{"n":128,"quiz":21,"quizTitle":"Gestion des opérations de sécurité (partie 2)","scenario":3,"scenarioText":["Ecovista Energy Global (EVEG) est une société innovante axée sur le développement durable fondée en 2015, à Amsterdam, aux Pays-Bas. Elle opère à l’international et a établi une présence importante en Europe, en Asie du Sud-est et en Amérique du Nord. EVEG est spécialisée dans la fourniture de solutions écologiques et écoénergétiques aux entreprises et aux industries qui cherchent à réduire leur impact négatif sur l’environnement. L’entreprise propose un large éventail de solutions d’énergies renouvelables, y compris des systèmes d’énergie solaire, des installations éoliennes et des technologies de conversion de la biomasse. À mesure que EVEG se développait et étendait ses opérations à l’échelle mondiale, garantir la sécurité de ses informations et de ses systèmes est devenu crucial. À ce titre, la direction générale d’EVEG a décidé de mettre en œuvre un système de management de la sécurité de l’information (SMSI) conformément à la norme ISO/IEC 27001. Après une appréciation complète des risques, l’équipe SMSI a identifié les mesures de sécurité de l’information de l’Annexe A de la norme ISO/IEC 27001 qui étaient critiques à la posture de sécurité de l’organisation.","Pour protéger ses données sensibles, l’équipe SMSI a mis en œuvre des systèmes de contrôle d’accès robustes pour s’assurer que les employés n’ont accès qu’aux informations nécessaires à leurs rôles. En outre, l’authentification multifacteurs (AMF) a également été introduite pour les comptes privilégiés, afin de réduire davantage le risque d’accès non autorisé. De plus, l’équipe a reconnu l’importance de séparer les tâches et responsabilités conflictuelles au sein de l’organisation. Dans le cadre des mesures de sécurité, la direction générale s’est assurée que les rôles et responsabilités des employés sont clairement définis, et que les tâches conflictuelles sont séparées pour prévenir les abus potentiels ou empêcher l’accès non autorisé à des informations sensibles.","L’équipe SMSI s’est également penchée sur la nécessité de préserver la sécurité de l’information à un niveau approprié pendant les perturbations. L’équipe SMSI a établi que les imprévus, tels que les catastrophes naturelles, les cyberattaques ou les défaillances du système, peuvent potentiellement avoir un impact sur les opérations et la sécurité de l’information d’EVEG. C’est pourquoi l’équipe SMSI a soigneusement planifié ces perturbations et s’est préparée à cet effet, en veillant à ce que la sécurité de l’information reste robuste et efficace, même dans des circonstances difficiles.","L’équipe SMSI a également établi qu’il est essentiel de conserver des copies de sauvegarde des informations, des logiciels et des systèmes. À ce titre, elle a établi une politique complète et spécifique à la thématique de la sauvegarde, en veillant à ce que les copies de sauvegarde régulières soient créées et maintenues en toute sécurité.","Outre l’accent mis sur les contrôles d’accès, l’authentification multifacteurs et la planification des situations d’urgence, l’équipe SMSI a accordé la priorité à la protection de la précieuse propriété intellectuelle d’EVEG et à l’utilisation sécurisée des informations sensibles. L’équipe a décidé de mettre en œuvre des mesures de sécurité qui définissent des règles efficaces pour l’utilisation des techniques cryptographiques, notamment la gestion des clés cryptographiques. En outre, pour protéger les droits de propriété intellectuelle, l’équipe a mis en œuvre des procédures appropriées afin de protéger ses actifs intellectuels importants contre l’utilisation non autorisée, la reproduction ou la violation.","L’équipe SMSI n’a pas procédé à une analyse approfondie des coûts pour la mise en œuvre des mesures de sécurité. Elle a donc alloué des ressources insuffisantes dans certains domaines. L’équipe a rencontré des difficultés lors de la définition et de la mise en œuvre efficace des règles de gestion des clés cryptographiques, compromettant ainsi la sécurité de ses informations sensibles. Le manque de ressources et de préparation a également entraîné des écarts dans ses procédures de sauvegarde et de récupération. En conséquence, l’entreprise n’a pas pu tester l’efficacité des procédures de sauvegarde qui auraient garanti la récupérabilité des données et des systèmes en cas de perturbations."],"question":"En ne procédant pas à une analyse complète des coûts, qu’est-ce qu’EVEG n’a pas réussi à faire efficacement ?","options":["Préparer la mise en œuvre des mesures de sécurité","Concevoir et décrire les mesures de sécurité","Évaluer l’efficacité des mesures de sécurité"],"correct":0,"explanation":"Pour mettre en œuvre efficacement les mesures de sécurité de l’information, il convient que l’organisation procède notamment à une analyse des coûts."},{"n":129,"quiz":22,"quizTitle":"Surveillance, mesurage, analyse et évaluation","scenario":null,"scenarioText":[],"question":"Lors de la planification de la surveillance, du mesurage, de l’analyse et de l’évaluation, il convient que les organisations définissent leur « besoin en information ». Ce besoin représente un enjeu ou une déclaration de haut niveau sur la sécurité de l’information qui aide l’organisation à évaluer la performance en matière de sécurité de l’information, afin que ces évaluations répondent aux besoins définis.","options":["Vrai","Faux"],"correct":0,"explanation":"Une bonne pratique consiste à définir le « besoin d’information » lors de la planification de la surveillance, du mesurage, de l’analyse et de l’évaluation. Un besoin d’information est généralement exprimé en tant qu’enjeu ou déclaration de sécurité d’information de haut niveau qui aide l’organisation à évaluer la performance en matière de sécurité de l’information et l’efficacité du SMSI. En d’autres termes, il convient de procéder à la surveillance et au mesurage pour répondre à un besoin d’information défini."},{"n":130,"quiz":22,"quizTitle":"Surveillance, mesurage, analyse et évaluation","scenario":null,"scenarioText":[],"question":"Qu’entend-on par mesurage ?","options":["Processus d’observation d’un système, d’un processus ou d’un produit pour déterminer ses niveaux de performance","Processus de détermination de la valeur et des caractéristiques d’un système, d’un processus ou d’un produit","Processus d’examen d’un système, d’un processus ou d’un produit afin de mieux le comprendre"],"correct":1,"explanation":"Le mesurage est le processus de détermination de la valeur et des caractéristiques d’un système, d’un processus ou d’un produit. Les options A et C renvoient respectivement à la surveillance et à l’analyse."},{"n":131,"quiz":22,"quizTitle":"Surveillance, mesurage, analyse et évaluation","scenario":null,"scenarioText":[],"question":"Laquelle des déclarations suivantes concernant ISO/IEC 27004 est correcte ?","options":["ISO/IEC 27004 fournit des lignes directrices pour aider les organisations à évaluer les performances du SMSI","Les organisations peuvent obtenir une certification conformément à ISO/IEC 27004","ISO/IEC 27004 ne précise NI l'objet NI le moment de la surveillance et du mesurage"],"correct":0,"explanation":"La norme fournit des lignes directrices pour aider les organisations à évaluer les performances du SMSI afin de se conformer aux exigences de l’article 9.1 Surveillance, mesurage, analyse et évaluation de la norme ISO/IEC 27001. Elle explique en détail ce qu’il faut surveiller et mesurer et à quel moment, établit des procédures, analyse les résultats et examine et améliore les processus de surveillance, mesurage, analyse et évaluation. Cette norme ne se prête pas à des fins de certification."},{"n":132,"quiz":22,"quizTitle":"Surveillance, mesurage, analyse et évaluation","scenario":null,"scenarioText":[],"question":"Sur quel aspect les tableaux de bord stratégiques se concentrent-ils avant tout ?","options":["Tâches opérationnelles détaillées et activités quotidiennes au sein de l’organisation","Mesures de performance et prévisions de haut niveau pour les décideurs","Évaluations individuelles de la performance des employés"],"correct":1,"explanation":"Les tableaux de bord stratégiques sont des aperçus rapides qui aident les gestionnaires à tous les niveaux à surveiller la santé financière de l’entreprise, en mettant l’accent sur des mesures de performance et des prévisions de haut niveau."},{"n":133,"quiz":23,"quizTitle":"Audit interne","scenario":null,"scenarioText":[],"question":"Que fournit ISO 19011 ?","options":["Exigences applicables aux organisations fournissant des services d’audit et de certification","Lignes directrices concernant les compétences nécessaires que les auditeurs doivent avoir pour auditer un SMSI","Lignes directrices pour la gestion d’un programme d’audit et la planification et la réalisation d’audits de systèmes de management"],"correct":2,"explanation":"La norme ISO 19011 fournit des lignes directrices pour la gestion d’un programme d’audit, la planification et la conduite d’un système de management, ainsi que pour les compétences des auditeurs."},{"n":134,"quiz":23,"quizTitle":"Audit interne","scenario":null,"scenarioText":[],"question":"Qui est chargé de prendre les mesures requises et appropriées après la communication des résultats de l’audit ?","options":["La direction générale","L'équipe d’audit","Les consultants externes"],"correct":0,"explanation":"Un audit évalue les preuves et les faits pour identifier les forces et les faiblesses du système de management. Les résultats sont communiqués à la direction générale, qui entreprend alors les actions appropriées."},{"n":135,"quiz":23,"quizTitle":"Audit interne","scenario":null,"scenarioText":[],"question":"Les audits internes sont aussi connus sous le nom d’audits de seconde partie.","options":["Vrai","Faux"],"correct":1,"explanation":"Les audits de seconde partie sont des audits externes. Ils sont menés par des parties qui ont un intérêt pour l'audité et ne sont pas destinés à des fins de certification."},{"n":136,"quiz":23,"quizTitle":"Audit interne","scenario":null,"scenarioText":[],"question":"Laquelle des déclarations suivantes concernant les audits internes n’est PAS correcte ?","options":["Les audits internes n’ont pas de rôle consultatif au sein de l’organisation","Les audits internes tiennent compte de l’efficacité et de l’efficience du SMSI","Les audits internes sont indépendants des activités auditées"],"correct":0,"explanation":"Un audit interne joue un rôle consultatif pour l’amélioration du SMSI au sein de l’organisation, alors qu’un audit externe ne le fait pas."},{"n":137,"quiz":23,"quizTitle":"Audit interne","scenario":null,"scenarioText":[],"question":"Laquelle des responsabilités suivantes incombe à un auditeur interne ?","options":["Planifier des activités d’audit","Définir l’étendue du programme d’audit","Affecter les ressources nécessaires au programme d’audit interne"],"correct":0,"explanation":"Un auditeur interne est chargé de planifier les activités d’audit. Les options B et C font référence aux responsabilités des personnes qui gèrent le programme d’audit."},{"n":138,"quiz":23,"quizTitle":"Audit interne","scenario":null,"scenarioText":[],"question":"Quelle est la bonne définition d’une non-conformité ?","options":["Défaut de communication efficace avec les parties prenantes","Interruption temporaire des services en raison de la maintenance","Non-satisfaction d’une exigence"],"correct":2,"explanation":"Conformément à la norme ISO 9000, la non-conformité est le « non-satisfaction d’une exigence »."},{"n":139,"quiz":23,"quizTitle":"Audit interne","scenario":null,"scenarioText":[],"question":"Les organisations doivent corriger toutes les non-conformités simultanément.","options":["Vrai","Faux"],"correct":1,"explanation":"Il est très peu probable qu’une organisation corrige simultanément toutes les non-conformités. Toute amélioration nécessite du temps et des ressources. Les plans d’action peuvent être classés par ordre de priorité par la direction générale. Par conséquent, l’auditeur devra chercher à s’assurer que les objectifs d’amélioration sont réalistes en fonction du contexte particulier de l’audité."},{"n":140,"quiz":24,"quizTitle":"Revue de direction","scenario":null,"scenarioText":[],"question":"Une organisation qui souhaite se conformer à la norme ISO/IEC 27001 doit effectuer des revues de direction à des intervalles planifiés.","options":["Vrai","Faux"],"correct":0,"explanation":"Conformément à l’article 9.3 de la norme ISO/IEC 27001, l’organisation doit examiner le SMSI à intervalles planifiés et conserver les informations documentées comme preuve des résultats des revues de direction."},{"n":141,"quiz":24,"quizTitle":"Revue de direction","scenario":null,"scenarioText":[],"question":"Lequel des éléments suivants n’a PAS besoin d’être inclus dans la revue de direction ?","options":["Retours d'information sur la performance des employés","Retours d'information des parties intéressées","Retours d'information sur la performance en matière de sécurité de l’information"],"correct":0,"explanation":"La revue de direction comprend l’examen de divers aspects, y compris le statut des actions antérieures, les changements dans les enjeux externes et internes liés au système de management de la sécurité de l’information, les retours d’information sur la performance en matière de sécurité de l’information, les retours d’information des parties intéressées, les résultats de l’appréciation des risques et du plan de traitement des risques, et les possibilités d’amélioration continue."},{"n":142,"quiz":24,"quizTitle":"Revue de direction","scenario":null,"scenarioText":[],"question":"Que faut-il, entre autres éléments, inclure dans les résultats de la revue de direction ?","options":["Décisions relatives aux possibilités de traitement des risques","Décisions relatives aux possibilités d’amélioration continue","À la fois A et B"],"correct":1,"explanation":"Les résultats de la revue de direction devraient inclure des décisions relatives aux possibilités d’amélioration continue et à tout besoin de modification du système de management de la sécurité de l’information."},{"n":143,"quiz":24,"quizTitle":"Revue de direction","scenario":null,"scenarioText":[],"question":"Selon ISO/IEC 27001, quelles informations convient-il de documenter lors de la réalisation d’une revue de direction ?","options":["Résultats de la surveillance et du mesurage","Résultats de l’appréciation des risques","À la fois A et B"],"correct":2,"explanation":"Les renseignements tirés de la revue de direction qui devraient être documentés comprennent : les décisions et les mesures à prendre, les responsabilités et les échéanciers des mesures convenues, la date et le lieu de l’examen, les changements identifiés dans l’environnement interne et externe, les critères par rapport auxquels le SMSI a été examiné et les contributeurs et leur rôle dans l’examen, entre autres."},{"n":144,"quiz":25,"quizTitle":"Traitement des non-conformités","scenario":null,"scenarioText":[],"question":"Une action entreprise pour éliminer la cause d’une non-conformité et prévenir la récidive est appelée :","options":["Correction","Action corrective","Action préventive"],"correct":1,"explanation":"Les actions préventives sont des actions entreprises pour éliminer la cause d’une non-conformité potentielle ou d’une autre situation indésirable potentielle, tandis que la correction est la l’action entreprise pour éliminer une non-conformité détectée."},{"n":145,"quiz":25,"quizTitle":"Traitement des non-conformités","scenario":null,"scenarioText":[],"question":"Selon la norme ISO/IEC 27001, qui est chargé de vérifier l’efficacité des actions correctives entreprises en cas de non-conformité ?","options":["L’organisation","L’auditeur interne","Le chef de projet SMSI"],"correct":0,"explanation":"Conformément à l’article 10.2 de la norme ISO/IEC 27001, en cas de non-conformité, l’organisation doit entreprendre toute action nécessaire et examiner l’efficacité des actions correctives entreprises."},{"n":146,"quiz":25,"quizTitle":"Traitement des non-conformités","scenario":null,"scenarioText":[],"question":"Que devrait inclure un plan d’action ?","options":["Un délai de mise en œuvre","Les coûts des mesures correctives","Les éléments de preuve de la non-conformité constatée"],"correct":0,"explanation":"Un plan d’action peut être rédigé de manière sommaire, doit permettre de corriger la non-conformité, devrait être fondé sur une approche préventive et corrective, doit inclure un calendrier de mise en œuvre et doit produire des résultats vérifiables."},{"n":147,"quiz":25,"quizTitle":"Traitement des non-conformités","scenario":null,"scenarioText":[],"question":"Toutes les non-conformités devraient être incluses dans un seul plan d’action inclusif. Il est inapproprié d’élaborer un plan d’action pour chaque non-conformité.","options":["Vrai","Faux"],"correct":1,"explanation":"Un plan d’action doit être soumis pour chaque non-conformité et non un plan d’action global pour toutes les non-conformités."},{"n":148,"quiz":25,"quizTitle":"Traitement des non-conformités","scenario":null,"scenarioText":[],"question":"Que se passe-t-il si l'audité n’a pas soumis les plans d’action dans le délai imparti ?","options":["L'audité devra demander une autre date de soumission","L’auditeur émettra une non-conformité majeure","L’audité ne sera pas recommandé pour la certification"],"correct":2,"explanation":"Si les plans d’action ne sont pas envoyés dans les délais impartis, l’organisation ne sera pas recommandée pour la certification."},{"n":149,"quiz":25,"quizTitle":"Traitement des non-conformités","scenario":null,"scenarioText":[],"question":"Quelles activités, entre autres, sont incluses dans la phase d’analyse de situation du processus d’actions correctives ?","options":["Identification et documentation des non-conformités","Suivi et revue des actions correctives","Évaluation des options et sélection des solutions"],"correct":2,"explanation":"Pendant la phase d’analyse de situation du processus d’actions correctives, l’organisation analyse les causes fondamentales des non-conformités, évalue les options et sélectionne des solutions."},{"n":150,"quiz":26,"quizTitle":"Amélioration continue","scenario":null,"scenarioText":[],"question":"Lesquels des éléments suivants ne sont PAS considérés comme un facteur de changement du SMSI qui doit être surveillé ?","options":["Changements dans les technologies","Changements organisationnels","Revues de produits"],"correct":2,"explanation":"Les facteurs de changement du SMSI à surveiller comprennent les changements organisationnels, les changements technologiques, les changements externes et les changements internes au SMSI."},{"n":151,"quiz":26,"quizTitle":"Amélioration continue","scenario":null,"scenarioText":[],"question":"De quoi dépend la fréquence de revue du SMSI d’une organisation ?","options":["Le nombre d'employés dans l’organisation, ses revenus annuels et sa situation géographique","La conformité de l’organisation aux réglementations de l’industrie, aux retours d'information des clients et à la satisfaction des employés","La nature, l’échelle et la complexité de l’organisation, son profil de risque commercial et l’environnement dans lequel elle exerce ses activités"],"correct":2,"explanation":"La fréquence de la revue du SMSI dépend de facteurs tels que la nature, l’échelle, la complexité, le profil de risque commercial et l’environnement opérationnel de l’organisation."},{"n":152,"quiz":26,"quizTitle":"Amélioration continue","scenario":null,"scenarioText":[],"question":"L’amélioration continue n’a aucun impact sur la collaboration en équipe.","options":["Vrai","Faux"],"correct":1,"explanation":"En s’efforçant constamment d’atteindre des objectifs communs, les équipes peuvent établir de nouvelles connexions et renforcer les relations existantes."},{"n":153,"quiz":26,"quizTitle":"Amélioration continue","scenario":null,"scenarioText":[],"question":"L’organisation A n'évalue et ne met à jour ses processus du SMSI que lorsque des non-conformités sont détectées, afin de s'assurer qu'ils sont efficaces. Est-ce une bonne pratique ?","options":["Non, il convient d'effectuer régulièrement des évaluations et des mises à jour des processus du SMSI","Non, la norme ISO 27001 exige que les organisations évaluent et mettent à jour les processus du SMSI chaque année","Oui, les processus du SMSI ne devraient être évalués et mis à jour que lorsque des non-conformités sont détectées"],"correct":0,"explanation":"Une organisation devrait considérer son SMSI comme une partie évolutive des opérations commerciales, en s’adaptant constamment à des circonstances en constante évolution. Même si les processus pouvaient être adéquats au moment de la mise en œuvre, ils sont toujours sujets à de nouveaux développements."},{"n":154,"quiz":26,"quizTitle":"Amélioration continue","scenario":null,"scenarioText":[],"question":"Lequel des éléments suivants est réalisé lorsque les processus du SMSI et les mesures de sécurité de l’information sont compatibles avec les objectifs généraux, les activités et les processus de l’organisation ?","options":["Pertinence","Adéquation","Efficacité"],"correct":1,"explanation":"L’amélioration continue du SMSI devrait impliquer que le SMSI lui-même et tous ses éléments soient évalués en tenant compte des enjeux internes et externes, des exigences des parties intéressées et des résultats de l’évaluation des performances. L’évaluation devrait comprendre, entre autres, une analyse de l’adéquation du SMSI, en examinant si les processus du SMSI et les mesures de sécurité de l’information sont compatibles avec les objectifs, activités et processus généraux de l’organisation."},{"n":155,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":null,"scenarioText":[],"question":"Au cours de quelle phase du processus de certification SMSI l’étape 2 de l’audit est-elle menée ?","options":["Avant l’audit","Audit initial","Après l’audit"],"correct":1,"explanation":"L’audit initial comprend la préparation de l’audit, l’étape 1 de l’audit et l’étape 2 de l'audit."},{"n":156,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":null,"scenarioText":[],"question":"Laquelle des raisons suivantes n’est PAS valable pour rejeter un auditeur ?","options":["L’auditeur a récemment procédé à l'audit d'un concurrent majeur de l'audité","L’auditeur a audité l’organisation par le passé","L’auditeur a travaillé pour l’un des concurrents de l’organisation"],"correct":0,"explanation":"L’entité auditée ne peut rejeter un auditeur que pour certaines raisons, notamment lorsque l’auditeur est en situation de conflit d’intérêts (réel ou potentiel), qu’il a audité l’organisation par le passé et, par conséquent, que le client n’est pas convaincu qu’il recevra une valeur ajoutée de l’audit, et qu’il a déjà travaillé pour l’audité ou pour l’un de ses principaux concurrents."},{"n":157,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":null,"scenarioText":[],"question":"Quelle est l’activité principale de l’étape 1 de l'audit ?","options":["Vérifier l’efficacité du système de management","Passer en revue les informations documentées","Évaluer la conformité aux exigences de la norme"],"correct":1,"explanation":"La revue des informations documentées est la principale activité de l’étape 1 de l’audit. Les deux autres options font référence aux activités de l’étape 2 de l'audit."},{"n":158,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":null,"scenarioText":[],"question":"L’auditeur émet la décision finale de certification à la fin de l’audit.","options":["Vrai","Faux"],"correct":1,"explanation":"Au terme de l’audit, l’auditeur émet une recommandation de certification. La décision finale de certification est prise par le comité de certification de l’organisme de certification."},{"n":159,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":null,"scenarioText":[],"question":"Quel est le but du suivi d’audit ?","options":["Valider le contrôle opérationnel des processus de l’audité","Vérifier la « conception » du système de management","Valider les plans d’action et les plans d’actions correctives présentés par l’audité"],"correct":2,"explanation":"Le suivi d’audit est généralement initié après une non-conformité majeure, avant la recommandation de l’organisation pour la certification. Son objectif principal est donc de valider l’efficacité des plans d’action et des actions correctives."},{"n":160,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":4,"scenarioText":["Markt est une entreprise de recrutement réputée spécialisée dans la recherche d’employés qualifiés pour divers postes sollicités par d’autres entreprises. L’entreprise opère dans un secteur concurrentiel où il est crucial de préserver la confidentialité, l’intégrité et la disponibilité des données des clients et des candidats. Markt traite les informations sensibles, notamment les données personnelles, les coordonnées et parfois même les données financières des candidats et des clients. Conscient de l’importance de garantir la sécurité de l’information, Markt a décidé de mettre en œuvre un système de management de la sécurité de l’information (SMSI) conformément à la norme ISO/IEC 27001. Suite à la mise en œuvre des exigences ISO/IEC 27001, Markt a décidé de procéder à un audit interne dans le cadre de l’évaluation des performances de son SMSI. La direction générale de l’entreprise a nommé Lisa comme auditeur interne pour planifier les dispositions d’un audit afin d’évaluer la conformité du SMSI aux exigences de Markt pour le SMSI et aux exigences de la norme ISO/IEC 27001. Lisa s’est vu confier la responsabilité de déterminer les ressources requises pour le programme d’audit.","Elle a défini les objectifs du programme d’audit et a procédé à la mise en œuvre des dispositions prévues. Mais, elle n’a ni déterminé ni évalué les risques et les opportunités du programme d’audit puisqu’elle croyait que l’entreprise fonctionne dans un environnement à faible risque avec des changements minimalistes dans ses processus ou sa réglementation. Pour assurer une évaluation complète du SMSI, Lisa a soigneusement planifié les principales activités conformément aux objectifs du programme d’audit. Ses activités d’audit prévues comprenaient la revue de l’application de politiques internes, de procédures et d’autres informations documentées pertinentes de l'entreprise, de l’efficacité du processus d’exploitation et d’appréciation des risques de l’entreprise et du niveau de conformité aux lois, réglementations et exigences pertinentes de la norme.","Après avoir recueilli suffisamment de preuves d’audit, Lisa les a évaluées sur la base des critères d’audit et a rédigé les constatations d’audit. Après avoir analysé et examiné les constatations en tenant compte des objectifs de l’audit, elle a publié les conclusions d’audit, lesquelles révélaient à la fois les domaines de conformité et de non-conformité. Les non-conformités détectées par Lisa lors de l’audit ont été documentées dans un rapport de non-conformité. Après réception de ce rapport, Markt a d’abord analysé la cause fondamentale des non-conformités identifiées, puis a sélectionné les actions correctives appropriées pour y remédier."],"question":"La direction générale a confié à Lisa la responsabilité de déterminer les ressources nécessaires au programme d’audit. Est-ce conforme aux bonnes pratiques ?","options":["Non, déterminer les ressources pour le programme d’audit relève des responsabilités du service des Finances","Non, déterminer les ressources pour le programme d’audit relève uniquement des responsabilités de la direction générale","Oui, la personne qui gère le programme d’audit peut déterminer les ressources pour le programme d’audit"],"correct":2,"explanation":"Il convient que la ou les personnes qui gèrent le programme d’audit établissent, planifient, coordonnent et surveillent tous les aspects du programme d’audit, y compris la détermination des ressources du programme d’audit."},{"n":161,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":4,"scenarioText":["Markt est une entreprise de recrutement réputée spécialisée dans la recherche d’employés qualifiés pour divers postes sollicités par d’autres entreprises. L’entreprise opère dans un secteur concurrentiel où il est crucial de préserver la confidentialité, l’intégrité et la disponibilité des données des clients et des candidats. Markt traite les informations sensibles, notamment les données personnelles, les coordonnées et parfois même les données financières des candidats et des clients. Conscient de l’importance de garantir la sécurité de l’information, Markt a décidé de mettre en œuvre un système de management de la sécurité de l’information (SMSI) conformément à la norme ISO/IEC 27001. Suite à la mise en œuvre des exigences ISO/IEC 27001, Markt a décidé de procéder à un audit interne dans le cadre de l’évaluation des performances de son SMSI. La direction générale de l’entreprise a nommé Lisa comme auditeur interne pour planifier les dispositions d’un audit afin d’évaluer la conformité du SMSI aux exigences de Markt pour le SMSI et aux exigences de la norme ISO/IEC 27001. Lisa s’est vu confier la responsabilité de déterminer les ressources requises pour le programme d’audit.","Elle a défini les objectifs du programme d’audit et a procédé à la mise en œuvre des dispositions prévues. Mais, elle n’a ni déterminé ni évalué les risques et les opportunités du programme d’audit puisqu’elle croyait que l’entreprise fonctionne dans un environnement à faible risque avec des changements minimalistes dans ses processus ou sa réglementation. Pour assurer une évaluation complète du SMSI, Lisa a soigneusement planifié les principales activités conformément aux objectifs du programme d’audit. Ses activités d’audit prévues comprenaient la revue de l’application de politiques internes, de procédures et d’autres informations documentées pertinentes de l'entreprise, de l’efficacité du processus d’exploitation et d’appréciation des risques de l’entreprise et du niveau de conformité aux lois, réglementations et exigences pertinentes de la norme.","Après avoir recueilli suffisamment de preuves d’audit, Lisa les a évaluées sur la base des critères d’audit et a rédigé les constatations d’audit. Après avoir analysé et examiné les constatations en tenant compte des objectifs de l’audit, elle a publié les conclusions d’audit, lesquelles révélaient à la fois les domaines de conformité et de non-conformité. Les non-conformités détectées par Lisa lors de l’audit ont été documentées dans un rapport de non-conformité. Après réception de ce rapport, Markt a d’abord analysé la cause fondamentale des non-conformités identifiées, puis a sélectionné les actions correctives appropriées pour y remédier."],"question":"Après avoir établi les objectifs du programme d’audit, Lisa a décidé de ne pas déterminer ni d'évaluer les risques et les opportunités du programme d’audit, car elle croyait que l’entreprise fonctionne dans un environnement à faible risque avec des changements minimalistes dans ses processus ou sa réglementation. Est-ce conforme aux bonnes pratiques ?","options":["Non, après avoir défini les objectifs du programme d’audit, il convient de déterminer et d'évaluer les risques et les opportunités du programme d’audit","Oui, il n’est pas nécessaire d’évaluer les risques et les opportunités du programme d’audit si l’organisation fonctionne dans un environnement à faible risque avec des changements minimalistes","Non, l'auditeur interne ne doit pas définir les objectifs du programme d’audit, car cette responsabilité relève de l’autorité de la direction générale"],"correct":0,"explanation":"Après avoir établi les objectifs du programme d’audit, il convient qu’une organisation détermine et évalue les risques et les opportunités du programme d’audit."},{"n":162,"quiz":27,"quizTitle":"Préparation à l’audit de certification","scenario":4,"scenarioText":["Markt est une entreprise de recrutement réputée spécialisée dans la recherche d’employés qualifiés pour divers postes sollicités par d e à la mise en œuvre des exigences ISO/IEC 27001, Markt a décidé de procéder à un audit interne dans le cadre de l’évaluation des performances de son SMSI. La direction générale de l’entreprise a nommé Lisa comme auditeur interne pour planifier les dispositions d’un audit afin d’évaluer la conformité du SMSI aux exigences de Markt pour le SMSI et aux exigences de la norme ISO/IEC 27001. Lisa s’est vu confier la responsabilité de déterminer les ressources requises pour le programme d’audit.","Elle a défini les objectifs du programme d’audit et a procédé à la mise en œuvre des dispositions prévues. Mais, elle n’a ni déterminé ni évalué les risques et les opportunités du programme d’audit puisqu’elle croyait que l’entreprise fonctionne dans un environnement à faible risque avec des changements minimalistes dans ses processus ou sa réglementation. Pour assurer une évaluation complète du SMSI, Lisa a soigneusement planifié les principales activités conformément aux objectifs du programme d’audit. Ses activités d’audit prévues comprenaient la revue de l’application de politiques internes, de procédures et d’autres informations documentées pertinentes de l'entreprise, de l’efficacité du processus d’exploitation et d’appréciation des risques de l’entreprise et du niveau de conformité aux lois, réglementations et exigences pertinentes de la norme.","Après avoir recueilli suffisamment de preuves d’audit, Lisa les a évaluées sur la base des critères d’audit et a rédigé les constatations d’audit. Après avoir analysé et examiné les constatations en tenant compte des objectifs de l’audit, elle a publié les conclusions d’audit, lesquelles révélaient à la fois les domaines de conformité et de non-conformité. Les non-conformités détectées par Lisa lors de l’audit ont été documentées dans un rapport de non-conformité. Après réception de ce rapport, Markt a d’abord analysé la cause fondamentale des non-conformités identifiées, puis a sélectionné les actions correctives appropriées pour y remédier."],"question":"Lisa a-t-elle publié les conclusions d’audit conformément aux bonnes pratiques ?","options":["Oui, Lisa a publié les conclusions après avoir revu les constatations d’audit, en tenant compte des objectifs de l’audit","Non, Lisa aurait dû revoir les constatations d’audit en collaboration avec le gestionnaire de projet SMSI de l’entreprise, puis publier les conclusions de l’audit","Non, Lisa aurait dû soumettre les constatations d’audit à la direction générale, laquelle peut ensuite rendre les conclusions d’audit"],"correct":0,"explanation":"Selon la norme ISO 19011, les conclusions de l’audit font référence aux résultats d’un audit, après examen des objectifs de l’audit et de toutes les constatations de l’audit."}];

<script>
/* ==========================================================================
   Quiz ISO/IEC 27001 LI — moteur de diapositives
   Un seul fichier, deux modes commutables a chaud :

   ========================================================================== */
(function () {

  var STORE = 'iso27001-quiz-v2';
  var TRAINING = 'entrainement';

  var total = QUESTIONS.length;

  /* --- etat ------------------------------------------------------------- */
  var state = { pos: 0, answers: {}, mode: TRAINING };

    if (saved && typeof saved === 'object') {

      if (typeof saved.pos === 'number') state.pos = Math.min(Math.max(saved.pos, 0), total);
      if (saved.answers && typeof saved.answers === 'object') state.answers = saved.answers;
    }
  } catch (e) { /* stockage indisponible : on continue sans reprise */ }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  function isTraining() { return state.mode === TRAINING; }

  /* La synthese n'existe qu'en entrainement : elle occupe la position
     total, juste apres la derniere question. */
  function maxPos() { return isTraining() ? total : total - 1; }

  /* --- index des quiz --------------------------------------------------- */
  var quizzes = [];
  var byQuiz = {};
  QUESTIONS.forEach(function (q, i) {
    if (!byQuiz[q.quiz]) {
      byQuiz[q.quiz] = { n: q.quiz, title: q.quizTitle, items: [] };
      quizzes.push(byQuiz[q.quiz]);
    }
    byQuiz[q.quiz].items.push(i);
  });

  /* --- raccourcis DOM --------------------------------------------------- */
  var $ = function (sel) { return document.querySelector(sel); };
  var stage = $('#stage');
  var fill = $('#progressFill');
  var counter = $('#counter');
  var scoreEl = $('#score');
  var ticksLabel = $('#ticksLabel');
  var ticksStrip = $('#ticksStrip');
  var sheet = $('#sheet');
  var sheetGrid = $('#sheetGrid');
  var keyhint = $('#keyhint');
  var btnPrev = $('#btnPrev');
  var btnNext = $('#btnNext');
  var btnReset = $('#btnReset');
  var modeBtns = [].slice.call(document.querySelectorAll('[data-mode]'));

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function pad(n, width) {
    var s = String(n);
    while (s.length < width) s = '0' + s;
    return s;
  }

  /* --- comptages -------------------------------------------------------- */
  function answered() { return Object.keys(state.answers).length; }

  function correctCount() {
    var c = 0;
    Object.keys(state.answers).forEach(function (k) {
      if (QUESTIONS[+k] && state.answers[k] === QUESTIONS[+k].correct) c++;
    });
    return c;
  }

  function quizStats(quiz) {
    var ok = 0, bad = 0;
    quiz.items.forEach(function (i) {
      var pick = state.answers[i];
      if (pick == null) return;
      if (pick === QUESTIONS[i].correct) ok++; else bad++;
    });
    return { ok: ok, bad: bad, done: ok + bad, total: quiz.items.length };
  }

  /* --- bloc explication ------------------------------------------------- */
  function explainBlock(q) {
    var box = el('div', 'explain');
    box.appendChild(el('div', 'explain__label', 'Explication'));
    box.appendChild(el('p', null, q.explanation));
    return box;
  }

  /* --- rendu d'une diapositive question --------------------------------- */
  function renderQuestion(index) {
    var q = QUESTIONS[index];
    var training = isTraining();
    var pick = state.answers[index];
    var revealed = !training || pick != null;

    var slide = el('div', 'slide');
    slide.setAttribute('role', 'group');
    slide.setAttribute('aria-label', 'Question ' + q.n + ' sur ' + total);

    /* bandeau de reperage */
    var eyebrow = el('div', 'slide__eyebrow');
    eyebrow.appendChild(el('span', 'chip chip--quiz', 'Quiz ' + pad(q.quiz, 2)));
    if (q.scenario) {
      eyebrow.appendChild(el('span', 'chip chip--scenario', 'Scénario ' + q.scenario));
    }
    eyebrow.appendChild(el('span', 'slide__topic', q.quizTitle));
    slide.appendChild(eyebrow);

    /* dossier de scenario : ouvert sur la premiere question, replie ensuite */
    if (q.scenarioText && q.scenarioText.length) {
      var siblings = QUESTIONS.reduce(function (acc, item, i) {
        if (item.quiz === q.quiz && item.scenario === q.scenario) acc.push(i);
        return acc;
      }, []);
      var isFirst = siblings[0] === index;

      var det = el('details', 'scenario');
      det.open = isFirst;
      det.appendChild(el('summary', null, 'Scénario ' + q.scenario + ' — contexte'
        + (isFirst ? '' : ' (replié)')));

      var body = el('div', 'scenario__body');
      var prose = el('div', 'scenario__prose');
      q.scenarioText.forEach(function (para) { prose.appendChild(el('p', null, para)); });
      body.appendChild(prose);

      var jump = el('nav', 'scenario__jump');
      jump.setAttribute('aria-label', 'Questions du scénario ' + q.scenario);
      jump.appendChild(el('span', 'scenario__jump-label', siblings.length + ' questions'));
      siblings.forEach(function (i) {
        var b = el('button', 'jumpbtn', 'Question ' + pad(QUESTIONS[i].n, 3));
        b.type = 'button';
        if (i === index) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () { go(i); });
        jump.appendChild(b);
      });
      body.appendChild(jump);

      det.appendChild(body);
      slide.appendChild(det);
    }

    /* enonce */
    var qBlock = el('div', 'question');
    qBlock.appendChild(el('div', 'question__index mono', pad(q.n, 3)));
    qBlock.appendChild(el('h1', 'question__text', q.question));
    slide.appendChild(qBlock);

    /* verdict immediat (entrainement, apres reponse) */
    if (training && pick != null) {
      var good = pick === q.correct;
      var bar = el('div', 'verdictbar');
      bar.setAttribute('data-verdict', good ? 'ok' : 'bad');
      bar.setAttribute('role', 'status');
      bar.appendChild(el('span', null, good ? '✓ Bonne réponse' : '✗ Mauvaise réponse'));
      if (!good) {
        bar.appendChild(el('small', null, 'La bonne réponse est ' + LETTERS[q.correct] + '.'));
      }
      slide.appendChild(bar);
    }

    /* options */
    var list = el('ul', 'options');
    q.options.forEach(function (text, i) {
      var li = el('li');
      var btn = el('button', 'option');
      btn.type = 'button';
      btn.style.setProperty('--delay', (i * 0.045) + 's');
      btn.appendChild(el('span', 'option__key', LETTERS[i]));
      btn.appendChild(el('span', 'option__label', text));
      var verdict = el('span', 'option__verdict');
      btn.appendChild(verdict);

      if (revealed) {
        var good = i === q.correct;
        btn.setAttribute('data-verdict', good ? 'ok' : 'bad');
        btn.disabled = true;
        if (good) {
          verdict.textContent = '✓ Bonne réponse';
        } else if (training && pick === i) {
          verdict.textContent = '✗ Votre réponse';
        } else {
          verdict.textContent = '✗ Mauvaise réponse';
        }
        if (training && pick === i) btn.setAttribute('data-picked', 'true');
      } else {
        btn.addEventListener('click', function () { answer(index, i); });
      }

      li.appendChild(btn);
      list.appendChild(li);
    });
    slide.appendChild(list);

    /* explication : d'emblee en corrige, apres la reponse en entrainement */
    if (revealed && q.explanation) slide.appendChild(explainBlock(q));

    /* invitation a repondre, tant que rien n'est coche */
    if (!revealed) {
      var hint = el('p', 'prompt', 'Choisissez une réponse pour voir le verdict et l’explication.');
      slide.appendChild(hint);
    }

    return slide;
  }

  /* --- rendu de la diapositive de synthese ------------------------------ */
  function renderReport() {
    var wrap = el('div', 'slide wrap');
    var done = answered();
    var ok = correctCount();
    var bad = done - ok;
    var pct = done ? Math.round((ok / done) * 100) : 0;

    var eyebrow = el('div', 'slide__eyebrow');
    eyebrow.appendChild(el('span', 'chip chip--quiz', 'Synthèse'));
    eyebrow.appendChild(el('span', 'slide__topic', total + ' questions · 27 quiz'));
    wrap.appendChild(eyebrow);

    wrap.appendChild(el('h1', 'wrap__title', 'Résultats des 27 quiz'));
    wrap.appendChild(el('p', 'wrap__lede', done === total
      ? 'Vous avez répondu à l’ensemble des ' + total + ' questions. Le détail par quiz indique où concentrer vos révisions avant l’examen.'
      : 'Vous avez répondu à ' + done + ' des ' + total + ' questions. Le détail par quiz indique où concentrer vos révisions.'));

    var metrics = el('div', 'metrics');
    [
      ['metric metric--accent', pct + ' %', 'Taux de réussite'],
      ['metric metric--ok', String(ok), 'Bonnes réponses'],
      ['metric metric--bad', String(bad), 'Mauvaises réponses'],
      ['metric', done + ' / ' + total, 'Questions traitées']
    ].forEach(function (m) {
      var card = el('div', m[0]);
      card.appendChild(el('div', 'metric__value mono', m[1]));
      card.appendChild(el('div', 'metric__label', m[2]));
      metrics.appendChild(card);
    });
    wrap.appendChild(metrics);

    var tw = el('div', 'tablewrap');
    var table = el('table', 'report');
    var thead = el('thead');
    var hr = el('tr');
    ['Quiz', 'Thème', 'Traitées', 'Justes', 'Fausses', 'Score'].forEach(function (h, i) {
      hr.appendChild(el('th', i === 1 ? null : 'num', h));
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el('tbody');
    quizzes.forEach(function (quiz) {
      var s = quizStats(quiz);
      var tr = el('tr');
      tr.appendChild(el('td', 'num', pad(quiz.n, 2)));

      var tdTitle = el('td', 'title');
      var link = el('button', 'linkbtn', quiz.title);
      link.type = 'button';
      link.addEventListener('click', function () { go(quiz.items[0]); });
      tdTitle.appendChild(link);
      tr.appendChild(tdTitle);

      tr.appendChild(el('td', 'num', s.done + ' / ' + s.total));

      var tdOk = el('td', 'num');
      tdOk.appendChild(el('span', s.ok ? 'ok' : null, String(s.ok)));
      tr.appendChild(tdOk);

      var tdBad = el('td', 'num');
      tdBad.appendChild(el('span', s.bad ? 'bad' : null, String(s.bad)));
      tr.appendChild(tdBad);

      tr.appendChild(el('td', 'num', s.done ? Math.round((s.ok / s.done) * 100) + ' %' : '—'));
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tw.appendChild(table);
    wrap.appendChild(tw);

    var actions = el('div', 'wrap__actions');

    var again = el('button', 'navbtn navbtn--primary', 'Recommencer');
    again.type = 'button';
    again.addEventListener('click', reset);
    actions.appendChild(again);

    var review = el('button', 'navbtn', 'Passer au corrigé complet');
    review.type = 'button';
    review.addEventListener('click', function () { setMode(KEY, 0); });
    actions.appendChild(review);

    /* raccourci vers les questions manquees */
    var missed = Object.keys(state.answers).filter(function (k) {
      return state.answers[k] !== QUESTIONS[+k].correct;
    }).map(Number).sort(function (a, b) { return a - b; });

    if (missed.length) {
      var toMissed = el('button', 'navbtn',
        'Revoir la 1re erreur (question ' + pad(QUESTIONS[missed[0]].n, 3) + ')');
      toMissed.type = 'button';
      toMissed.addEventListener('click', function () { go(missed[0]); });
      actions.appendChild(toMissed);
    }

    wrap.appendChild(actions);
    return wrap;
  }

  /* --- appareillage : compteurs, jauge, releve -------------------------- */
  var HINT_TRAINING = '<span><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd> répondre</span>'
    + '<span><kbd>&#8592;</kbd><kbd>&#8594;</kbd> naviguer</span>'
    + '<span><kbd>M</kbd> mode</span><span><kbd>S</kbd> sommaire</span>';
  var HINT_KEY = '<span><kbd>&#8592;</kbd><kbd>&#8594;</kbd> naviguer</span>'
    + '<span><kbd>M</kbd> revenir à l’entraînement</span><span><kbd>S</kbd> sommaire</span>';

  function renderChrome() {
    var training = isTraining();
    var onReport = training && state.pos >= total;
    var q = onReport ? null : QUESTIONS[state.pos];

    modeBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode));
    });

    keyhint.innerHTML = training ? HINT_TRAINING : HINT_KEY;

    counter.innerHTML = '';
    if (onReport) {
      counter.appendChild(el('span', null, 'Synthèse'));
    } else {
      counter.appendChild(el('b', null, pad(q.n, 3)));
      counter.appendChild(document.createTextNode(' / ' + total));
    }

    scoreEl.hidden = !training;
    btnReset.hidden = !training;
    if (training) {
      scoreEl.innerHTML = '';
      scoreEl.appendChild(el('b', null, String(correctCount())));
      scoreEl.appendChild(document.createTextNode(' justes / ' + answered() + ' traitées'));
    }

    var shown = onReport ? total : state.pos;
    fill.style.width = ((shown / total) * 100).toFixed(2) + '%';

    /* releve du quiz courant */
    ticksStrip.innerHTML = '';
    if (onReport) {
      ticksLabel.textContent = 'Fin du parcours';
      return;
    }
    var quiz = byQuiz[q.quiz];
    var s = quizStats(quiz);
    ticksLabel.textContent = 'Quiz ' + pad(quiz.n, 2) + ' · ' +
      (training ? s.done + '/' + s.total + ' traitées' : s.total + ' questions');

    quiz.items.forEach(function (i) {
      var t = el('button', 'tick');
      t.type = 'button';
      var label = 'Question ' + QUESTIONS[i].n;
      var pick = state.answers[i];
      if (pick != null) {
        var good = pick === QUESTIONS[i].correct;
        t.setAttribute('data-state', good ? 'ok' : 'bad');
        label += good ? ' — juste' : ' — fausse';
      } else if (!training && i < state.pos) {
        t.setAttribute('data-state', 'seen');
      }
      if (i === state.pos) t.setAttribute('aria-current', 'true');
      t.setAttribute('aria-label', label);
      t.title = label;
      t.addEventListener('click', function () { go(i); });
      ticksStrip.appendChild(t);
    });
  }

  /* --- navigation ------------------------------------------------------- */
  function render() {
    stage.innerHTML = '';
    stage.appendChild(isTraining() && state.pos >= total
      ? renderReport()
      : renderQuestion(state.pos));
    stage.scrollTop = 0;
    renderChrome();
    btnPrev.disabled = state.pos === 0;
    btnNext.disabled = state.pos >= maxPos();
    save();
  }

  function go(pos) {
    state.pos = Math.min(Math.max(pos, 0), maxPos());
    closeSheet();
    render();
  }

  function answer(index, choice) {
    state.answers[index] = choice;
    save();
    render();
  }

  /* Bascule de mode. La position est conservee : on reste sur la meme
     question en passant de l'entrainement au corrige et inversement. */
  function setMode(mode, pos) {
    if (mode !== TRAINING && mode !== KEY) return;
    var wasOnReport = isTraining() && state.pos >= total;
    state.mode = mode;
    if (pos != null) state.pos = pos;
    /* depuis la synthese, le corrige reprend au debut plutot que de retomber
       sur la derniere question par simple recadrage */
    else if (wasOnReport && mode === KEY) state.pos = 0;
    state.pos = Math.min(Math.max(state.pos, 0), maxPos());
    closeSheet();
    render();
  }

  function toggleMode() { setMode(isTraining() ? KEY : TRAINING); }

  function reset() {
    if (!window.confirm('Effacer toutes vos réponses et repartir de la question 1 ?')) return;
    state.answers = {};
    state.pos = 0;
    state.mode = TRAINING;
    save();
    render();
  }

  /* --- sommaire --------------------------------------------------------- */
  function buildSheet() {
    sheetGrid.innerHTML = '';
    quizzes.forEach(function (quiz) {
      var card = el('button', 'quizcard');
      card.type = 'button';
      if (QUESTIONS[state.pos] && QUESTIONS[state.pos].quiz === quiz.n) {
        card.setAttribute('aria-current', 'true');
      }
      card.appendChild(el('span', 'quizcard__n', pad(quiz.n, 2)));
      card.appendChild(el('span', 'quizcard__title', quiz.title));

      var meta = el('span', 'quizcard__meta');
      var s = quizStats(quiz);
      meta.appendChild(document.createTextNode(quiz.items.length + ' questions'));
      if (s.done) {
        meta.appendChild(document.createTextNode(' · '));
        meta.appendChild(el('span', 'ok', s.ok + ' justes'));
        meta.appendChild(document.createTextNode(' · '));
        meta.appendChild(el('span', 'bad', s.bad + ' fausses'));
      }
      card.appendChild(meta);

      card.addEventListener('click', function () { go(quiz.items[0]); });
      sheetGrid.appendChild(card);
    });
  }

  function openSheet() {
    buildSheet();
    sheet.setAttribute('data-open', 'true');
    var current = sheetGrid.querySelector('[aria-current="true"]') || sheetGrid.firstChild;
    if (current) current.focus();
  }

  function closeSheet() { sheet.setAttribute('data-open', 'false'); }

  function toggleSheet() {
    if (sheet.getAttribute('data-open') === 'true') closeSheet(); else openSheet();
  }

  /* --- branchements ----------------------------------------------------- */
  btnPrev.addEventListener('click', function () { go(state.pos - 1); });
  btnNext.addEventListener('click', function () { go(state.pos + 1); });
  btnReset.addEventListener('click', reset);
  $('#btnIndex').addEventListener('click', toggleSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (ev) { if (ev.target === sheet) closeSheet(); });

  modeBtns.forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    if (ev.key === 'Escape') {
      if (sheet.getAttribute('data-open') === 'true') { closeSheet(); ev.preventDefault(); }
      return;
    }

    /* sommaire ouvert : on laisse le clavier au sommaire */
    if (sheet.getAttribute('data-open') === 'true') return;

    /* un bouton a le focus : Entree et Espace lui appartiennent */
    var onControl = tag === 'button' || tag === 'summary' || tag === 'a';
    if (onControl && (ev.key === 'Enter' || ev.key === ' ')) return;

    switch (ev.key) {
      case 'ArrowRight': case 'PageDown': case ' ': case 'Enter':
        go(state.pos + 1); ev.preventDefault(); return;
      case 'ArrowLeft': case 'PageUp':
        go(state.pos - 1); ev.preventDefault(); return;
      case 'Home':
        go(0); ev.preventDefault(); return;
      case 'End':
        go(maxPos()); ev.preventDefault(); return;
    }

    var k = ev.key.toLowerCase();
    if (k === 's') { toggleSheet(); ev.preventDefault(); return; }
    if (k === 'm') { toggleMode(); ev.preventDefault(); return; }

    if (isTraining() && state.pos < total && state.answers[state.pos] == null) {
      var q = QUESTIONS[state.pos];
      var idx = -1;
      if (ev.key >= '1' && ev.key <= '9') idx = +ev.key - 1;
      else if (k >= 'a' && k <= 'f') idx = k.charCodeAt(0) - 97;
      if (idx >= 0 && idx < q.options.length) { answer(state.pos, idx); ev.preventDefault(); }
    }
  });

  render();
})();

</script>
