nation":"La mesure 8.33 demande que les informations de test soient sélectionnées, protégées et gérées de manière appropriée ; la mesure 8.11 recommande le masquage des données, en particulier des données à caractère personnel. Héberger les tests avec la production contredirait en outre la mesure 8.31 (Séparation des environnements).","domain":4},{"n":35,"quiz":5,"quizTitle":"Pixelnord · notes d’entretiens","scenario":5,"scenarioText":["Pixelnord est un studio de jeux vidéo lillois de 250 personnes, dont la moitié en télétravail. Un éditeur international lui confie le développement d’un jeu très attendu, à condition que le code source et les éléments graphiques soient protégés. Léa, nouvelle responsable de la sécurité, rencontre les responsables d’équipe pendant sa première semaine. Extraits de ses notes :","Responsable de production — « Les graphistes partagent les maquettes non publiées avec nos prestataires d’animation par des liens publics de stockage en ligne. C’est plus rapide que les procédures. »","Directeur technique — « Le code source est dans notre dépôt. Tout le monde y a accès en lecture et en écriture, stagiaires compris : ça évite les demandes. Pour les tests, on utilise une copie des comptes réels des joueurs de notre précédent jeu. »","Responsable des ressources humaines — « Les contrats de travail ne parlent pas de confidentialité : l’éditeur ne l’a pas demandé explicitement. Quand quelqu’un part, on récupère son badge, mais pas toujours son ordinateur portable. »","Responsable informatique — « Les télétravailleurs utilisent leurs ordinateurs personnels. On leur a envoyé une note de cinq pages sur les bonnes pratiques, mais je ne sais pas qui l’a lue. »","Office manager — « Les bureaux sont en open space. Les esquisses des personnages restent souvent sur les tables le soir, et l’équipe de ménage d’un prestataire passe à 21 h. »","À l’issue de ces entretiens, Léa rédige un plan d’action."],"question":"Selon le scénario 5, l’absence de clause de confidentialité dans les contrats est-elle justifiée par le silence de l’éditeur ?","options":["Oui, car les engagements de confidentialité ne s’imposent que lorsqu’un client, un éditeur ou une autorité les exige expressément par contrat","Non, car les conditions d’emploi doivent préciser les responsabilités de sécurité, appuyées par des accords de confidentialité","Non, car la confidentialité doit figurer uniquement dans la politique de sécurité, et non dans les contrats"],"correct":1,"explanation":"La mesure 6.2 demande que les accords contractuels d’emploi indiquent les responsabilités du personnel et de l’organisation en matière de sécurité de l’information ; la mesure 6.6 prévoit des accords de confidentialité ou de non-divulgation reflétant les besoins de protection de l’organisation. Ces besoins découlent des risques identifiés par Pixelnord, pas des seules demandes de l’éditeur.","domain":2},{"n":36,"quiz":5,"quizTitle":"Pixelnord · notes d’entretiens","scenario":5,"scenarioText":["Pixelnord est un studio de jeux vidéo lillois de 250 personnes, dont la moitié en télétravail. Un éditeur international lui confie le développement d’un jeu très attendu, à condition que le code source et les éléments graphiques soient protégés. Léa, nouvelle responsable de la sécurité, rencontre les responsables d’équipe pendant sa première semaine. Extraits de ses notes :","Responsable de production — « Les graphistes partagent les maquettes non publiées avec nos prestataires d’animation par des liens publics de stockage en ligne. C’est plus rapide que les procédures. »","Directeur technique — « Le code source est dans notre dépôt. Tout le monde y a accès en lecture et en écriture, stagiaires compris : ça évite les demandes. Pour les tests, on utilise une copie des comptes réels des joueurs de notre précédent jeu. »","Responsable des ressources humaines — « Les contrats de travail ne parlent pas de confidentialité : l’éditeur ne l’a pas demandé explicitement. Quand quelqu’un part, on récupère son badge, mais pas toujours son ordinateur portable. »","Responsable informatique — « Les télétravailleurs utilisent leurs ordinateurs personnels. On leur a envoyé une note de cinq pages sur les bonnes pratiques, mais je ne sais pas qui l’a lue. »","Office manager — « Les bureaux sont en open space. Les esquisses des personnages restent souvent sur les tables le soir, et l’équipe de ménage d’un prestataire passe à 21 h. »","À l’issue de ces entretiens, Léa rédige un plan d’action."],"question":"Selon le scénario 5, quelle mesure de l’Annexe A n’est pas respectée lorsqu’un salarié part sans rendre son ordinateur portable ?","options":["Annexe A 5.9 Inventaire des informations et autres actifs associés","Annexe A 8.6 Dimensionnement","Annexe A 5.11 Restitution des actifs"],"correct":2,"explanation":"La mesure 5.11 demande que le personnel et les autres parties intéressées restituent tous les actifs de l’organisation en leur possession au changement ou à la fin de leur emploi, contrat ou accord. L’inventaire (5.9) permet de savoir ce qui doit être restitué, mais c’est bien la restitution qui fait ici défaut.","domain":2},{"n":37,"quiz":5,"quizTitle":"Pixelnord · notes d’entretiens","scenario":5,"scenarioText":["Pixelnord est un studio de jeux vidéo lillois de 250 personnes, dont la moitié en télétravail. Un éditeur international lui confie le développement d’un jeu très attendu, à condition que le code source et les éléments graphiques soient protégés. Léa, nouvelle responsable de la sécurité, rencontre les responsables d’équipe pendant sa première semaine. Extraits de ses notes :","Responsable de production — « Les graphistes partagent les maquettes non publiées avec nos prestataires d’animation par des liens publics de stockage en ligne. C’est plus rapide que les procédures. »","Directeur technique — « Le code source est dans notre dépôt. Tout le monde y a accès en lecture et en écriture, stagiaires compris : ça évite les demandes. Pour les tests, on util e. Extraits de ses notes :","Responsable de production — « Les graphistes partagent les maquettes non publiées avec nos prestataires d’animation par des liens publics de stockage en ligne. C’est plus rapide que les procédures. »","Directeur technique — « Le code source est dans notre dépôt. Tout le monde y a accès en lecture et en écriture, stagiaires compris : ça évite les demandes. Pour les tests, on utilise une copie des comptes réels des joueurs de notre précédent jeu. »","Responsable des ressources humaines — « Les contrats de travail ne parlent pas de confidentialité : l’éditeur ne l’a pas demandé explicitement. Quand quelqu’un part, on récupère son badge, mais pas toujours son ordinateur portable. »","Responsable informatique — « Les télétravailleurs utilisent leurs ordinateurs personnels. On leur a envoyé une note de cinq pages sur les bonnes pratiques, mais je ne sais pas qui l’a lue. »","Office manager — « Les bureaux sont en open space. Les esquisses des personnages restent souvent sur les tables le soir, et l’équipe de ménage d’un prestataire passe à 21 h. »","À l’issue de ces entretiens, Léa rédige un plan d’action."],"question":"Selon le scénario 5, quelle mesure Léa doit-elle inscrire à son plan d’action pour les esquisses laissées sur les tables le soir ?","options":["Annexe A 7.7 Bureau propre et écran vide","Annexe A 7.4 Surveillance de la sécurité physique","Annexe A 7.12 Sécurité du câblage"],"correct":0,"explanation":"La mesure 7.7 demande de définir et d’appliquer des règles de bureau propre pour les documents papier et les supports amovibles, et d’écran vide pour les moyens de traitement. Une vidéosurveillance (7.4) pourrait détecter un vol, mais n’empêche pas qu’un document laissé sur un bureau soit vu ou photographié par le personnel de ménage.","domain":4},{"n":39,"quiz":6,"quizTitle":"Hydréa · décisions du comité de direction","scenario":6,"scenarioText":["Hydréa, régie des eaux d’une métropole de 600 agents, distribue l’eau potable à 900 000 habitants. Elle est certifiée ISO 9001 et ISO 14001. Avec la transposition de la directive NIS 2, elle relève désormais des entités soumises à des obligations de gestion des risques de cybersécurité et de notification des incidents.","Le conseil d’administration demande un plan d’action. Le comité de direction retient les orientations suivantes :","1. Mettre en place un SMSI conforme à ISO/IEC 27001 et le faire certifier dans les deux ans, en l’intégrant au système de management qualité et environnement existant.","2. S’appuyer sur ISO/IEC 27005 pour la gestion des risques et sur ISO/IEC 27002 pour le choix et la mise en œuvre des mesures.","3. Inclure dans le domaine d’application les systèmes de télégestion des stations de pompage et de traitement.","4. Faire appel à un organisme de certification. La directrice qualité suggère plutôt de « demander directement l’accréditation au COFRAC, ce sera plus rapide ».","5. Le directeur des systèmes d’information propose d’adopter à la place le NIST Cybersecurity Framework, « plus moderne », et de renoncer à la certification.","6. La direction juridique rappelle qu’un ordre de modification du dosage de chlore envoyé par la télégestion doit pouvoir être attribué de façon certaine à son émetteur, qui ne doit pas pouvoir le contester.","Le comité confie enfin la conduite du projet au directeur des opérations."],"question":"Selon le scénario 6, l’intégration du SMSI au système de management qualité et environnement est-elle envisageable ?","options":["Oui, car les normes ISO de système de management partagent une structure harmonisée qui facilite leur intégration","Non, car ISO/IEC 27001 exige un système de management distinct, audité séparément des autres","Oui, mais à condition de renoncer aux certifications ISO 9001 et ISO 14001 au profit d’ISO/IEC 27001"],"correct":0,"explanation":"ISO/IEC 27001, ISO 9001 et ISO 14001 suivent la structure harmonisée des normes ISO de système de management (anciennement Annexe SL) : mêmes , car ISO/IEC 27005 guide la gestion des risques et ISO/IEC 27002 décrit des mesures de référence, sans être certifiables","Non, car ISO/IEC 27001 interdit de recourir à d’autres normes pour concevoir le SMSI"],"correct":1,"explanation":"ISO/IEC 27005 fournit des lignes directrices pour gérer les risques de sécurité de l’information, en appui des exigences d’ISO/IEC 27001 ; ISO/IEC 27002 fournit un ensemble de référence de mesures et des recommandations de mise en œuvre. Seule ISO/IEC 27001 contient des exigences certifiables ; la protection de la vie privée relève d’ISO/IEC 27701.","domain":1},{"n":41,"quiz":6,"quizTitle":"Hydréa · décisions du comité de direction","scenario":6,"scenarioText":["Hydréa, régie des eaux d’une métropole de 600 agents, distribue l’eau potable à 900 000 habitants. Elle est certifiée ISO 9001 et ISO 14001. Avec la transposition de la directive NIS 2, elle relève désormais des entités soumises à des obligations de gestion des risques de cybersécurité et de notification des incidents.","Le conseil d’administration demande un plan d’action. Le comité de direction retient les orientations suivantes :","1. Mettre en place un SMSI conforme à ISO/IEC 27001 et le faire certifier dans les deux ans, en l’intégrant au système de management qualité et environnement existant.","2. S’appuyer sur ISO/IEC 27005 pour la gestion des risques et sur ISO/IEC 27002 pour le choix et la mise en œuvre des mesures.","3. Inclure dans le domaine d’application les systèmes de télégestion des stations de pompage et de traitement.","4. Faire appel à un organisme de certification. La directrice qualité suggère plutôt de « demander directement l’accréditation au COFRAC, ce sera plus rapide ».","5. Le directeur des systèmes d’information propose d’adopter à la place le NIST Cybersecurity Framework, « plus moderne », et de renoncer à la certification.","6. La direction juridique rappelle qu’un ordre de modification du dosage de chlore envoyé par la télégestion doit pouvoir être attribué de façon certaine à son émetteur, qui ne doit pas pouvoir le contester.","Le comité confie enfin la conduite du projet au directeur des opérations."],"question":"Selon le scénario 6, que penser de la suggestion de « demander directement l’accréditation au COFRAC » ?","options":["Elle confond deux notions : le COFRAC accrédite les organismes de certification, qui certifient les organisations","Elle est pertinente, car l’accréditation remplace la certification pour les organismes publics","Elle est pertinente, car le COFRAC certifie directement les SMSI des entités soumises à la directive NIS 2, sans intermédiaire"],"correct":0,"explanation":"L’accréditation est la reconnaissance, par un organisme national comme le COFRAC en France, de la compétence et de l’impartialité d’un organisme d’évaluation de la conformité. C’est cet organisme de certification accrédité qui audite et certifie le SMSI d’une organisation. Hydréa ne peut pas demander une accréditation pour elle-même.","domain":1},{"n":42,"quiz":6,"quizTitle":"Hydréa · décisions du comité de direction","scenario":6,"scenarioText":["Hydréa, régie des eaux d’une métropole de 600 agents, distribue l’eau potable à 900 000 habitants. Elle est certifiée ISO 9001 et ISO 14001. Avec la transposition de la directive NIS 2, elle relève désormais des entités soumises à des obligations de gestion des risques de cybersécurité et de notification des incidents.","Le conseil d’administration demande un plan d’action. Le comité de direction retient les orientations suivantes :","1. Mettre en place un SMSI conforme à ISO/IEC 27001 et le faire certifier dans les deux ans, en l’intégrant au système de management qualité et environnement existant.","2. S’appuyer sur ISO/IEC 27005 pour la gestion des risques et sur ISO/IEC 27002 pour le choix et la mise en œuvre des mesures.","3. Inclure dans le domaine d’application les systèmes de télégestion des stations de pompage et de traitement.","4. Faire appel à un organisme de certification. La directrice qualité suggère plutôt de « demander directement l’accréditation au COFRAC, ce sera plus rapide ».","5. Le directeur des systèmes d’information propose d’adopter à la place le NIST Cybersecurity Framework, « plus moderne », et de renoncer à la certification.","6. La direction juridique rappelle qu’un ordre de modification du dosage de chlore envoyé par la télégestion doit pouvoir être attribué de façon certaine à son émetteur, qui ne doit pas pouvoir le contester.","Le comité confie enfin la conduite du projet au directeur des opérations."],"question":"Selon le scénario 6, la proposition d’adopter le NIST Cybersecurity Framework à la place d’ISO/IEC 27001 est-elle adaptée à l’objectif fixé ?","options":["Oui, car le NIST Cybersecurity Framework est une norme certifiable, reconnue de manière équivalente en Europe","Oui, car le NIST Cybersecurity Framework est le référentiel imposé par la directive NIS 2","Non, car le NIST Cybersecurity Framework est un cadre volontaire, qui ne donne lieu à aucune certification"],"correct":2,"explanation":"Le NIST Cybersecurity Framework est un cadre volontaire de gestion des risques de cybersécurité. Il peut compléter un SMSI, mais il ne fait l’objet d’aucune certification et n’est pas imposé par NIS 2. Il ne permet donc pas d’atteindre l’objectif fixé par le conseil : une certification ISO/IEC 27001 dans les deux ans.","domain":1},{"n":43,"quiz":6,"quizTitle":"Hydréa · décisions du comité de direction","scenario":6,"scenarioText":["Hydréa, régie des eaux d’une métropole de 600 agents, distribue l’eau potable à 900 000 habitants. Elle est certifiée ISO 9001 et ISO 14001. Avec la transposition de la directive NIS 2, elle relève désormais des entités soumises à des obligations de gestion des risques de cybersécurité et de notification des incidents.","Le conseil d’administration demande un plan d’action. Le comité de direction retient les orientations suivantes :","1. Mettre en place un SMSI conforme à ISO/ gestion des risques de cybersécurité et de notification des incidents.","Le conseil d’administration demande un plan d’action. Le comité de direction retient les orientations suivantes :","1. Mettre en place un SMSI conforme à ISO/IEC 27001 et le faire certifier dans les deux ans, en l’intégrant au système de management qualité et environnement existant.","2. S’appuyer sur ISO/IEC 27005 pour la gestion des risques et sur ISO/IEC 27002 pour le choix et la mise en œuvre des mesures.","3. Inclure dans le domaine d’application les systèmes de télégestion des stations de pompage et de traitement.","4. Faire appel à un organisme de certification. La directrice qualité suggère plutôt de « demander directement l’accréditation au COFRAC, ce sera plus rapide ».","5. Le directeur des systèmes d’information propose d’adopter à la place le NIST Cybersecurity Framework, « plus moderne », et de renoncer à la certification.","6. La direction juridique rappelle qu’un ordre de modification du dosage de chlore envoyé par la télégestion doit pouvoir être attribué de façon certaine à son émetteur, qui ne doit pas pouvoir le contester.","Le comité confie enfin la conduite du projet au directeur des opérations."],"question":"Selon le scénario 6, comment Hydréa doit-elle prendre en compte la directive NIS 2 dans la planification de son SMSI ?","options":["Elle n’a pas à la prendre en compte, car la certification ISO/IEC 27001 vaut à elle seule présomption de conformité à NIS 2","Comme une exigence légale à identifier dans le contexte, puis à refléter dans l’appréciation des risques et le choix des mesures","Uniquement après l’obtention de la certification, lors de la première revue de direction"],"correct":1,"explanation":"Les obligations légales et réglementaires font partie des enjeux et des exigences des parties intéressées (articles 4.1 et 4.2) ; elles orientent l’appréciation des risques et le choix des mesures, et la mesure 5.31 d’ISO/IEC 27002 demande de les identifier et de les tenir à jour. Un SMSI certifié aide fortement à satisfaire NIS 2, mais la certification n’en vaut pas conformité automatique.","domain":3},{"n":45,"quiz":6,"quizTitle":"Hydréa · décisions du comité de direction","scenario":6,"scenarioText":["Hydréa, régie des eaux d’une métropole de 600 agents, distribue l’eau potable à 900 000 habitants. Elle est certifiée ISO 9001 et ISO 14001. Avec la transposition de la directive NIS 2, elle relève désormais des entités soumises à des obligations de gestion des risques de cybersécurité et de notification des incidents.","Le conseil d’administration demande un plan d’action. Le comité de direction retient les orientations suivantes :","1. Mettre en place un SMSI conforme à ISO/IEC 27001 et le faire certifier dans les deux ans, en l’intégrant au système de management qualité et environnement existant.","2. S’appuyer sur ISO/IEC 27005 pour la gestion des risques et sur ISO/IEC 27002 pour le choix et la mise en œuvre des mesures.","3. Inclure dans le domaine d’application les systèmes de télégestion des stations de pompage et de traitement.","4. Faire appel à un organisme de certification. La directrice qualité suggère plutôt de « demander directement l’accréditation au COFRAC, ce sera plus rapide ».","5. Le directeur des systèmes d’information propose d’adopter à la place le NIST Cybersecurity Framework, « plus moderne », et de renoncer à la certification.","6. La direction juridique rappelle qu’un ordre de modification du dosage de chlore envoyé par la télégestion doit pouvoir être attribué de façon certaine à son émetteur, qui ne doit pas pouvoir le contester.","Le comité confie enfin la conduite du projet au directeur des opérations."],"question":"Selon le scénario 6, que doit encore faire la direction après avoir confié le projet au directeur des opérations, au titre de l’article 5.3 ?","options":["Faire valider cette désignation par l’organisme de certification avant le lancement des travaux, comme l’exige la procédure de certification","Attribuer et communiquer les responsabilités et autorités des rôles de sécurité, dont le compte rendu des performances du SMSI","Rien de plus, car la désignation d’un responsable de projet satisfait entièrement l’article 5.3"],"correct":1,"explanation":"L’article 5.3 demande à la direction de s’assurer que les responsabilités et autorités des rôles concernés par la sécurité de l’information sont attribuées et communiquées au sein de l’organisation, notamment pour assurer la conformité du SMSI à la norme et pour rendre compte de ses performances à la direction. Désigner un chef de projet n’en est qu’une partie.","domain":2}];

<script>
/* ==========================================================================
   Quiz ISO/IEC 27001 LI — moteur de diapositives
   Un seul fichier, deux modes commutables a chaud :
     « entrainement » -> on repond, verdict vert / rouge, puis l'explication
     « corrige »      -> bonne reponse en vert, mauvaises en rouge, explication
   Les donnees (QUESTIONS) et la configuration (CONFIG) sont injectees avant
   ce script. CONFIG est facultatif : sans lui, le moteur regroupe par quiz.
   ========================================================================== */
(function () {
  'use strict';

  var CFG = (typeof CONFIG === 'object' && CONFIG) || {};
  var GROUP = CFG.group || 'Quiz';              /* libelle d'un regroupement */
  var GROUPS = CFG.groups || 'quiz';            /* pluriel, en minuscules     */
  var GROUP_PAD = CFG.groupPad || 2;            /* « Quiz 01 », « Domaine 1 » */
  var BASELINE = CFG.baseline || null;          /* { n: % obtenu a l'examen } */
  var TARGET = CFG.target || 70;                /* seuil de reussite vise, %  */
  /* La synthese peut regrouper autrement que la navigation : par exemple,
     naviguer par scenario mais compter par domaine d'examen (champ q.domain). */
  var BY_DOMAIN = CFG.reportBy === 'domain';
  var R_GROUP = BY_DOMAIN ? (CFG.reportGroup || 'Domaine') : GROUP;
  var R_GROUPS = BY_DOMAIN ? (CFG.reportGroups || 'domaines') : GROUPS;

  var LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];
  var STORE = CFG.store || 'iso27001-quiz-v2';
  var TRAINING = 'entrainement';
  var KEY = 'corrige';
  var total = QUESTIONS.length;

  /* --- etat ------------------------------------------------------------- */
  var state = { pos: 0, answers: {}, mode: TRAINING };

  try {
    var saved = JSON.parse(localStorage.getItem(STORE) || 'null');
    if (saved && typeof saved === 'object') {
      if (saved.mode === KEY || saved.mode === TRAINING) state.mode = saved.mode;
      if (typeof saved.pos === 'number') state.pos = Math.min(Math.max(saved.pos, 0), total);
      if (saved.answers && typeof saved.answers === 'object') state.answers = saved.answers;
    }
  } catch (e) { /* stockage indisponible : on continue sans reprise */ }

  function save() {
    try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) {}
  }

  function isTraining() { return state.mode === TRAINING; }

  /* La synthese n'existe qu'en entrainement : elle occupe la position
     total, juste apres la derniere question. */
  function maxPos() { return isTraining() ? total : total - 1; }

  /* --- index des quiz --------------------------------------------------- */
  var quizzes = [];
  var byQuiz = {};
  QUESTIONS.forEach(function (q, i) {
    if (!byQuiz[q.quiz]) {
      byQuiz[q.quiz] = { n: q.quiz, title: q.quizTitle, items: [] };
      quizzes.push(byQuiz[q.quiz]);
    }
    byQuiz[q.quiz].items.push(i);
  });

  var reportGroups = quizzes;
  if (BY_DOMAIN) {
    var byDomain = {};
    reportGroups = [];
    QUESTIONS.forEach(function (q, i) {
      if (!byDomain[q.domain]) {
        byDomain[q.domain] = { n: q.domain, title: (CFG.domains || {})[q.domain] || '', items: [] };
        reportGroups.push(byDomain[q.domain]);
      }
      byDomain[q.domain].items.push(i);
    });
    reportGroups.sort(function (a, b) { return a.n - b.n; });
  }

  /* --- raccourcis DOM --------------------------------------------------- */
  var $ = function (sel) { return document.querySelector(sel); };
  var stage = $('#stage');
  var fill = $('#progressFill');
  var counter = $('#counter');
  var scoreEl = $('#score');
  var ticksLabel = $('#ticksLabel');
  var ticksStrip = $('#ticksStrip');
  var sheet = $('#sheet');
  var sheetGrid = $('#sheetGrid');
  var keyhint = $('#keyhint');
  var btnPrev = $('#btnPrev');
  var btnNext = $('#btnNext');
  var btnReset = $('#btnReset');
  var modeBtns = [].slice.call(document.querySelectorAll('[data-mode]'));

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function pad(n, width) {
    var s = String(n);
    while (s.length < width) s = '0' + s;
    return s;
  }

  /* --- comptages -------------------------------------------------------- */
  function answered() { return Object.keys(state.answers).length; }

  function correctCount() {
    var c = 0;
    Object.keys(state.answers).forEach(function (k) {
      if (QUESTIONS[+k] && state.answers[k] === QUESTIONS[+k].correct) c++;
    });
    return c;
  }

  function quizStats(quiz) {
    var ok = 0, bad = 0;
    quiz.items.forEach(function (i) {
      var pick = state.answers[i];
      if (pick == null) return;
      if (pick === QUESTIONS[i].correct) ok++; else bad++;
    });
    return { ok: ok, bad: bad, done: ok + bad, total: quiz.items.length };
  }

  /* --- bloc explication ------------------------------------------------- */
  function explainBlock(q) {
    var box = el('div', 'explain');
    box.appendChild(el('div', 'explain__label', 'Explication'));
    box.appendChild(el('p', null, q.explanation));
    return box;
  }

  /* --- rendu d'une diapositive question --------------------------------- */
  function renderQuestion(index) {
    var q = QUESTIONS[index];
    var training = isTraining();
    var pick = state.answers[index];
    var revealed = !training || pick != null;

    var slide = el('div', 'slide');
    slide.setAttribute('role', 'group');
    slide.setAttribute('aria-label', 'Question ' + q.n + ' sur ' + total);

    /* bandeau de reperage */
    var eyebrow = el('div', 'slide__eyebrow');
    eyebrow.appendChild(el('span', 'chip chip--quiz', GROUP + ' ' + pad(q.quiz, GROUP_PAD)));
    if (q.scenario && CFG.scenarioChip !== false) {
      eyebrow.appendChild(el('span', 'chip chip--scenario', 'Scénario ' + q.scenario));
    }
    if (q.domain != null) {
      var dchip = el('span', 'chip chip--scenario', 'Domaine ' + q.domain);
      var dtitle = (CFG.domains || {})[q.domain];
      if (dtitle) dchip.title = dtitle;
      eyebrow.appendChild(dchip);
    }
    eyebrow.appendChild(el('span', 'slide__topic', q.quizTitle));
    slide.appendChild(eyebrow);

    /* dossier de scenario : ouvert sur la premiere question, replie ensuite */
    if (q.scenarioText && q.scenarioText.length) {
      var siblings = QUESTIONS.reduce(function (acc, item, i) {
        if (item.quiz === q.quiz && item.scenario === q.scenario) acc.push(i);
        return acc;
      }, []);
      var isFirst = siblings[0] === index;

      var det = el('details', isFirst ? 'scenario scenario--lead' : 'scenario');
      det.open = isFirst;
      det.appendChild(el('summary', null, 'Scénario ' + q.scenario + ' — contexte'
        + (isFirst ? '' : ' (replié)')));

      var body = el('div', 'scenario__body');
      var prose = el('div', 'scenario__prose');
      q.scenarioText.forEach(function (para) { prose.appendChild(el('p', null, para)); });
      body.appendChild(prose);

      var jump = el('nav', 'scenario__jump');
      jump.setAttribute('aria-label', 'Questions du scénario ' + q.scenario);
      jump.appendChild(el('span', 'scenario__jump-label', siblings.length + ' questions'));
      siblings.forEach(function (i) {
        var b = el('button', 'jumpbtn', 'Question ' + pad(QUESTIONS[i].n, 3));
        b.type = 'button';
        if (i === index) b.setAttribute('aria-current', 'true');
        b.addEventListener('click', function () { go(i); });
        jump.appendChild(b);
      });
      body.appendChild(jump);

      det.appendChild(body);
      slide.appendChild(det);
    }

    /* enonce */
    var qBlock = el('div', 'question');
    qBlock.appendChild(el('div', 'question__index mono', pad(q.n, 3)));
    qBlock.appendChild(el('h1', 'question__text', q.question));
    slide.appendChild(qBlock);

    /* verdict immediat (entrainement, apres reponse) */
    if (training && pick != null) {
      var good = pick === q.correct;
      var bar = el('div', 'verdictbar');
      bar.setAttribute('data-verdict', good ? 'ok' : 'bad');
      bar.setAttribute('role', 'status');
      bar.appendChild(el('span', null, good ? '✓ Bonne réponse' : '✗ Mauvaise réponse'));
      if (!good) {
        bar.appendChild(el('small', null, 'La bonne réponse est ' + LETTERS[q.correct] + '.'));
      }
      slide.appendChild(bar);
    }

    /* options */
    var list = el('ul', 'options');
    q.options.forEach(function (text, i) {
      var li = el('li');
      var btn = el('button', 'option');
      btn.type = 'button';
      btn.style.setProperty('--delay', (i * 0.045) + 's');
      btn.appendChild(el('span', 'option__key', LETTERS[i]));
      btn.appendChild(el('span', 'option__label', text));
      var verdict = el('span', 'option__verdict');
      btn.appendChild(verdict);

      if (revealed) {
        var good = i === q.correct;
        btn.setAttribute('data-verdict', good ? 'ok' : 'bad');
        btn.disabled = true;
        if (good) {
          verdict.textContent = '✓ Bonne réponse';
        } else if (training && pick === i) {
          verdict.textContent = '✗ Votre réponse';
        } else {
          verdict.textContent = '✗ Mauvaise réponse';
        }
        if (training && pick === i) btn.setAttribute('data-picked', 'true');
      } else {
        btn.addEventListener('click', function () { answer(index, i); });
      }

      li.appendChild(btn);
      list.appendChild(li);
    });
    slide.appendChild(list);

    /* explication : d'emblee en corrige, apres la reponse en entrainement */
    if (revealed && q.explanation) slide.appendChild(explainBlock(q));

    /* invitation a repondre, tant que rien n'est coche */
    if (!revealed) {
      var hint = el('p', 'prompt', 'Choisissez une réponse pour voir le verdict et l’explication.');
      slide.appendChild(hint);
    }

    return slide;
  }

  /* --- comparaison a l'examen ------------------------------------------- */
  function scoreOf(s) { return s.done ? (s.ok / s.done) * 100 : null; }

  function fmtPct(v) { return v == null ? '—' : (Math.round(v * 10) / 10).toString().replace('.', ',') + ' %'; }

  /* Combien de regroupements, parmi ceux deja abordes, atteignent le seuil */
  function aboveTarget() {
    var started = 0, reached = 0;
    reportGroups.forEach(function (quiz) {
      var v = scoreOf(quizStats(quiz));
      if (v == null) return;
      started++;
      if (v >= TARGET) reached++;
    });
    return ['metric metric--accent', reached + ' / ' + started,
      R_GROUPS.charAt(0).toUpperCase() + R_GROUPS.slice(1) + ' ≥ ' + TARGET + ' %'];
  }

  /* --- rendu de la diapositive de synthese ------------------------------ */
  function renderReport() {
    var wrap = el('div', 'slide wrap');
    var done = answered();
    var ok = correctCount();
    var bad = done - ok;
    var pct = done ? Math.round((ok / done) * 100) : 0;

    var eyebrow = el('div', 'slide__eyebrow');
    eyebrow.appendChild(el('span', 'chip chip--quiz', 'Synthèse'));
    eyebrow.appendChild(el('span', 'slide__topic', total + ' questions · ' + quizzes.length + ' ' + GROUPS
      + (BY_DOMAIN ? ' · ' + reportGroups.length + ' ' + R_GROUPS : '')));
    wrap.appendChild(eyebrow);

    wrap.appendChild(el('h1', 'wrap__title', CFG.reportTitle || ('Résultats des ' + quizzes.length + ' ' + GROUPS)));
    var lede = done === total
      ? 'Vous avez répondu à l’ensemble des ' + total + ' questions.'
      : 'Vous avez répondu à ' + done + ' des ' + total + ' questions.';
    lede += BASELINE
      ? ' Chaque ' + R_GROUP.toLowerCase() + ' est comparé à votre résultat d’examen ; le seuil visé est de ' + TARGET + ' %.'
      : ' Le détail par ' + R_GROUP.toLowerCase() + ' indique où concentrer vos révisions.';
    wrap.appendChild(el('p', 'wrap__lede', lede));

    var metrics = el('div', 'metrics');
    [
      ['metric metric--accent', pct + ' %', 'Taux de réussite'],
      ['metric metric--ok', String(ok), 'Bonnes réponses'],
      ['metric metric--bad', String(bad), 'Mauvaises réponses'],
      ['metric', done + ' / ' + total, 'Questions traitées']
    ].concat(BASELINE ? [aboveTarget()] : []).forEach(function (m) {
      var card = el('div', m[0]);
      card.appendChild(el('div', 'metric__value mono', m[1]));
      card.appendChild(el('div', 'metric__label', m[2]));
      metrics.appendChild(card);
    });
    wrap.appendChild(metrics);

    var tw = el('div', 'tablewrap');
    var table = el('table', 'report');
    var thead = el('thead');
    var hr = el('tr');
    var heads = [R_GROUP, 'Thème', 'Traitées', 'Justes', 'Fausses', 'Score'];
    if (BASELINE) heads = heads.concat(['Examen', 'Écart']);
    heads.forEach(function (h, i) {
      hr.appendChild(el('th', i === 1 ? null : 'num', h));
    });
    thead.appendChild(hr);
    table.appendChild(thead);

    var tbody = el('tbody');
    reportGroups.forEach(function (quiz) {
      var s = quizStats(quiz);
      var tr = el('tr');
      tr.appendChild(el('td', 'num', pad(quiz.n, GROUP_PAD)));

      var tdTitle = el('td', 'title');
      var link = el('button', 'linkbtn', quiz.title);
      link.type = 'button';
      link.addEventListener('click', function () { go(quiz.items[0]); });
      tdTitle.appendChild(link);
      tr.appendChild(tdTitle);

      tr.appendChild(el('td', 'num', s.done + ' / ' + s.total));

      var tdOk = el('td', 'num');
      tdOk.appendChild(el('span', s.ok ? 'ok' : null, String(s.ok)));
      tr.appendChild(tdOk);

      var tdBad = el('td', 'num');
      tdBad.appendChild(el('span', s.bad ? 'bad' : null, String(s.bad)));
      tr.appendChild(tdBad);

      var score = scoreOf(s);
      var tdScore = el('td', 'num');
      tdScore.appendChild(el('span', score == null ? null : (score >= TARGET ? 'ok' : 'bad'), fmtPct(score)));
      tr.appendChild(tdScore);

      if (BASELINE) {
        var base = BASELINE[quiz.n];
        tr.appendChild(el('td', 'num', base == null ? '—' : fmtPct(base)));
        var tdDelta = el('td', 'num');
        if (score == null || base == null) {
          tdDelta.textContent = '—';
        } else {
          var d = Math.round((score - base) * 10) / 10;
          if (d === 0) {
            tdDelta.textContent = '0 pt';
          } else {
            tdDelta.appendChild(el('span', d > 0 ? 'ok' : 'bad',
              (d > 0 ? '+' : '−') + fmtPct(Math.abs(d)).replace(' %', ' pts')));
          }
        }
        tr.appendChild(tdDelta);
      }
      tbody.appendChild(tr);
    });
    table.appendChild(tbody);
    tw.appendChild(table);
    wrap.appendChild(tw);

    var actions = el('div', 'wrap__actions');

    var again = el('button', 'navbtn navbtn--primary', 'Recommencer');
    again.type = 'button';
    again.addEventListener('click', reset);
    actions.appendChild(again);

    var review = el('button', 'navbtn', 'Passer au corrigé complet');
    review.type = 'button';
    review.addEventListener('click', function () { setMode(KEY, 0); });
    actions.appendChild(review);

    /* raccourci vers les questions manquees */
    var missed = Object.keys(state.answers).filter(function (k) {
      return state.answers[k] !== QUESTIONS[+k].correct;
    }).map(Number).sort(function (a, b) { return a - b; });

    if (missed.length) {
      var toMissed = el('button', 'navbtn',
        'Revoir la 1re erreur (question ' + pad(QUESTIONS[missed[0]].n, 3) + ')');
      toMissed.type = 'button';
      toMissed.addEventListener('click', function () { go(missed[0]); });
      actions.appendChild(toMissed);
    }

    wrap.appendChild(actions);
    return wrap;
  }

  /* --- appareillage : compteurs, jauge, releve -------------------------- */
  var HINT_TRAINING = '<span><kbd>A</kbd><kbd>B</kbd><kbd>C</kbd> répondre</span>'
    + '<span><kbd>&#8592;</kbd><kbd>&#8594;</kbd> naviguer</span>'
    + '<span><kbd>M</kbd> mode</span><span><kbd>S</kbd> sommaire</span>';
  var HINT_KEY = '<span><kbd>&#8592;</kbd><kbd>&#8594;</kbd> naviguer</span>'
    + '<span><kbd>M</kbd> revenir à l’entraînement</span><span><kbd>S</kbd> sommaire</span>';

  function renderChrome() {
    var training = isTraining();
    var onReport = training && state.pos >= total;
    var q = onReport ? null : QUESTIONS[state.pos];

    modeBtns.forEach(function (b) {
      b.setAttribute('aria-pressed', String(b.dataset.mode === state.mode));
    });

    keyhint.innerHTML = training ? HINT_TRAINING : HINT_KEY;

    counter.innerHTML = '';
    if (onReport) {
      counter.appendChild(el('span', null, 'Synthèse'));
    } else {
      counter.appendChild(el('b', null, pad(q.n, 3)));
      counter.appendChild(document.createTextNode(' / ' + total));
    }

    scoreEl.hidden = !training;
    btnReset.hidden = !training;
    if (training) {
      scoreEl.innerHTML = '';
      scoreEl.appendChild(el('b', null, String(correctCount())));
      scoreEl.appendChild(document.createTextNode(' justes / ' + answered() + ' traitées'));
    }

    var shown = onReport ? total : state.pos;
    fill.style.width = ((shown / total) * 100).toFixed(2) + '%';

    /* releve du quiz courant */
    ticksStrip.innerHTML = '';
    if (onReport) {
      ticksLabel.textContent = 'Fin du parcours';
      return;
    }
    var quiz = byQuiz[q.quiz];
    var s = quizStats(quiz);
    ticksLabel.textContent = GROUP + ' ' + pad(quiz.n, GROUP_PAD) + ' · ' +
      (training ? s.done + '/' + s.total + ' traitées' : s.total + ' questions');

    quiz.items.forEach(function (i) {
      var t = el('button', 'tick');
      t.type = 'button';
      var label = 'Question ' + QUESTIONS[i].n;
      var pick = state.answers[i];
      if (pick != null) {
        var good = pick === QUESTIONS[i].correct;
        t.setAttribute('data-state', good ? 'ok' : 'bad');
        label += good ? ' — juste' : ' — fausse';
      } else if (!training && i < state.pos) {
        t.setAttribute('data-state', 'seen');
      }
      if (i === state.pos) t.setAttribute('aria-current', 'true');
      t.setAttribute('aria-label', label);
      t.title = label;
      t.addEventListener('click', function () { go(i); });
      ticksStrip.appendChild(t);
    });
  }

  /* --- navigation ------------------------------------------------------- */
  function render() {
    stage.innerHTML = '';
    stage.appendChild(isTraining() && state.pos >= total
      ? renderReport()
      : renderQuestion(state.pos));
    stage.scrollTop = 0;
    renderChrome();
    btnPrev.disabled = state.pos === 0;
    btnNext.disabled = state.pos >= maxPos();
    save();
  }

  function go(pos) {
    state.pos = Math.min(Math.max(pos, 0), maxPos());
    closeSheet();
    render();
  }

  function answer(index, choice) {
    state.answers[index] = choice;
    save();
    render();
  }

  /* Bascule de mode. La position est conservee : on reste sur la meme
     question en passant de l'entrainement au corrige et inversement. */
  function setMode(mode, pos) {
    if (mode !== TRAINING && mode !== KEY) return;
    var wasOnReport = isTraining() && state.pos >= total;
    state.mode = mode;
    if (pos != null) state.pos = pos;
    /* depuis la synthese, le corrige reprend au debut plutot que de retomber
       sur la derniere question par simple recadrage */
    else if (wasOnReport && mode === KEY) state.pos = 0;
    state.pos = Math.min(Math.max(state.pos, 0), maxPos());
    closeSheet();
    render();
  }

  function toggleMode() { setMode(isTraining() ? KEY : TRAINING); }

  function reset() {
    if (!window.confirm('Effacer toutes vos réponses et repartir de la question 1 ?')) return;
    state.answers = {};
    state.pos = 0;
    state.mode = TRAINING;
    save();
    render();
  }

  /* --- sommaire --------------------------------------------------------- */
  function buildSheet() {
    sheetGrid.innerHTML = '';
    quizzes.forEach(function (quiz) {
      var card = el('button', 'quizcard');
      card.type = 'button';
      if (QUESTIONS[state.pos] && QUESTIONS[state.pos].quiz === quiz.n) {
        card.setAttribute('aria-current', 'true');
      }
      card.appendChild(el('span', 'quizcard__n', pad(quiz.n, GROUP_PAD)));
      card.appendChild(el('span', 'quizcard__title', quiz.title));

      var meta = el('span', 'quizcard__meta');
      var s = quizStats(quiz);
      meta.appendChild(document.createTextNode(quiz.items.length + ' questions'));
      if (s.done) {
        meta.appendChild(document.createTextNode(' · '));
        meta.appendChild(el('span', 'ok', s.ok + ' justes'));
        meta.appendChild(document.createTextNode(' · '));
        meta.appendChild(el('span', 'bad', s.bad + ' fausses'));
      }
      card.appendChild(meta);

      card.addEventListener('click', function () { go(quiz.items[0]); });
      sheetGrid.appendChild(card);
    });
  }

  function openSheet() {
    buildSheet();
    sheet.setAttribute('data-open', 'true');
    var current = sheetGrid.querySelector('[aria-current="true"]') || sheetGrid.firstChild;
    if (current) current.focus();
  }

  function closeSheet() { sheet.setAttribute('data-open', 'false'); }

  function toggleSheet() {
    if (sheet.getAttribute('data-open') === 'true') closeSheet(); else openSheet();
  }

  /* --- branchements ----------------------------------------------------- */
  btnPrev.addEventListener('click', function () { go(state.pos - 1); });
  btnNext.addEventListener('click', function () { go(state.pos + 1); });
  btnReset.addEventListener('click', reset);
  $('#btnIndex').addEventListener('click', toggleSheet);
  $('#sheetClose').addEventListener('click', closeSheet);
  sheet.addEventListener('click', function (ev) { if (ev.target === sheet) closeSheet(); });

  modeBtns.forEach(function (b) {
    b.addEventListener('click', function () { setMode(b.dataset.mode); });
  });

  document.addEventListener('keydown', function (ev) {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var tag = (ev.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;

    if (ev.key === 'Escape') {
      if (sheet.getAttribute('data-open') === 'true') { closeSheet(); ev.preventDefault(); }
      return;
    }

    /* sommaire ouvert : on laisse le clavier au sommaire */
    if (sheet.getAttribute('data-open') === 'true') return;

    /* un bouton a le focus : Entree et Espace lui appartiennent */
    var onControl = tag === 'button' || tag === 'summary' || tag === 'a';
    if (onControl && (ev.key === 'Enter' || ev.key === ' ')) return;

    switch (ev.key) {
      case 'ArrowRight': case 'PageDown': case ' ': case 'Enter':
        go(state.pos + 1); ev.preventDefault(); return;
      case 'ArrowLeft': case 'PageUp':
        go(state.pos - 1); ev.preventDefault(); return;
      case 'Home':
        go(0); ev.preventDefault(); return;
      case 'End':
        go(maxPos()); ev.preventDefault(); return;
    }

    var k = ev.key.toLowerCase();
    if (k === 's') { toggleSheet(); ev.preventDefault(); return; }
    if (k === 'm') { toggleMode(); ev.preventDefault(); return; }

    if (isTraining() && state.pos < total && state.answers[state.pos] == null) {
      var q = QUESTIONS[state.pos];
      var idx = -1;
      if (ev.key >= '1' && ev.key <= '9') idx = +ev.key - 1;
      else if (k >= 'a' && k <= 'f') idx = k.charCodeAt(0) - 97;
      if (idx >= 0 && idx < q.options.length) { answer(state.pos, idx); ev.preventDefault(); }
    }
  });

  render();
})();

</script>
